<style>
:root{--bg:#160b4f;--card:#2a1490;--card2:#3a1fb0;--line:#4f2fd6;--txt:#ffffff;--muted:#c9c3ee;--acc:#8b3dff;--acc2:#3a1fb0;--gold:#ffd447;--green:#5dff7a;--red:#ff6b6b;--cond:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif}
*{box-sizing:border-box}
html{background:#120a45}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(120% 60% at 80% 0%,#3a1c9c 0%,#1d0f63 45%,#120a45 100%) fixed;color:var(--txt);padding-bottom:110px;-webkit-font-smoothing:antialiased}
a{color:var(--gold)}
header{position:sticky;top:0;z-index:10;background:linear-gradient(#1d0f63ee,#1d0f6300);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:820px;margin:0 auto}
.brand h1{margin:0;font:800 25px var(--cond);letter-spacing:.2px;white-space:nowrap;display:flex;align-items:center}
#saldo{white-space:nowrap}
@media(max-width:430px){.brand h1{font-size:0}.brand h1 img{font-size:16px}}
.brand h1 span{color:var(--green)}
.brand button{padding:6px 14px;font-size:13px}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:2px;overflow-x:auto;background:#0d0826ee;border:1px solid #ffffff22;border-radius:40px;padding:7px;box-shadow:0 8px 24px #0009;scrollbar-width:none;max-width:800px;margin:0 auto}
nav::-webkit-scrollbar{display:none}
nav:empty{display:none}
nav button{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;border:0;border-radius:26px;padding:6px 4px;font-size:11px;font-weight:700;color:#c9c3ee;box-shadow:none}
nav button .ic{font-size:21px;line-height:1.15}
nav button.on{background:#ffffff16;color:var(--green)}
main{max-width:820px;margin:0 auto;padding:6px 14px 14px}
h2{margin:8px 2px 14px;font:800 30px var(--cond);letter-spacing:.2px}
h3{margin:2px 0 10px;font:800 21px var(--cond);letter-spacing:.2px}
.card{background:linear-gradient(160deg,#3d1fb8,#24107e);border:2px solid #4f2fd6;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px #0005,inset 0 1px 0 #ffffff22}
.card img{width:100%;border-radius:14px;margin-bottom:8px}
button{background:linear-gradient(#4b25c9,#3416a8);color:#fff;border:2px solid #6a45ef;border-radius:14px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #1d0b6b}
button:disabled{opacity:.5}
button.on{background:linear-gradient(#8b3dff,#5a12d6);border-color:#a46bff}
button.pri,button.ok{background:linear-gradient(#4ee36a,#1fb046);border:2px solid #7dff95;color:#fff;text-shadow:0 1px 0 #0b5a20;box-shadow:0 0 14px #3dff6a55,0 3px 0 #0d6b27;font:800 16px var(--cond);letter-spacing:.4px;text-transform:uppercase}
button.del{background:transparent;border-color:var(--red);color:var(--red);box-shadow:none}
input,select,textarea{background:#1a0d5a;color:#fff;border:2px solid #4f2fd6;border-radius:14px;padding:11px 12px;font-size:16px;width:100%;margin:4px 0 12px;font-family:inherit}
input::placeholder,textarea::placeholder{color:#9d95d6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
input[type=checkbox]{width:22px;height:22px;padding:0;margin:0 8px 0 0;vertical-align:middle;border-radius:6px;accent-color:var(--green)}
input.n{width:58px;text-align:center;margin:0}
label{font-size:13px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;background:#0d0826aa;padding:5px;border-radius:18px;border:1px solid #ffffff1a;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:transparent;border:0;box-shadow:none;color:var(--muted);border-radius:13px;padding:8px 12px}
.tabs button.on{background:linear-gradient(#8b3dff,#5a12d6);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid #ffffff1f;text-align:left}
th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.ris{font:800 26px var(--cond);color:var(--green)}
.pt{display:inline-block;padding:2px 9px;border-radius:10px;background:#ffffff18;font-weight:800}
.pt3{background:var(--green);color:#063}.pt1{background:var(--gold);color:#4a2c00}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#ffffff1c;color:#fff}
.ruolo{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-weight:800;font-size:12px;color:#fff;margin-right:8px;vertical-align:middle;border:2px solid #ffffff55}
.rP{background:#f59e0b}.rD{background:#22a35a}.rC{background:#2f6fed}.rA{background:#e5484d}
#chatbox{height:58vh;overflow-y:auto;background:#0d0826aa;border:1px solid #ffffff1a;border-radius:22px;padding:12px;margin-bottom:10px}
.scheda{display:flex;gap:16px;align-items:center}.scheda img{width:84px;height:84px;border-radius:50%;object-fit:cover}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat div{background:#ffffff12;border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--muted)}.stat b{display:block;font:800 24px var(--cond);color:#fff}
.msg{margin-bottom:10px;background:#ffffff10;border-radius:16px;padding:8px 12px}.msg b{color:var(--gold)}.msg small{color:var(--muted);margin-left:6px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:linear-gradient(#4ee36a,#1fb046);color:#fff;padding:11px 18px;border-radius:16px;font-weight:800;display:none;z-index:99;max-width:90%;box-shadow:0 8px 24px #0008}
#toast.err{background:var(--red)}
.auth{max-width:400px;margin:48px auto}
.logo{text-align:center;font-size:52px;margin-bottom:4px}
details summary{cursor:pointer;color:var(--muted);margin-top:8px}
@keyframes pk{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-6deg)}}
tr.mod td{background:#ffd44722}
/* carte giocatore */
.fcard{--w:112px;position:relative;width:var(--w);height:calc(var(--w)*1.4);font-size:calc(var(--w)/10);flex:0 0 auto;cursor:pointer;filter:drop-shadow(0 6px 8px #0009);clip-path:polygon(0 6%,6% 0,94% 0,100% 6%,100% 82%,50% 100%,0 82%);border-radius:10px;color:#3a2600}
.fcard.t-oro{background:linear-gradient(135deg,#fff1b0,#e8b923 50%,#8a5e00)}
.fcard.t-argento{background:linear-gradient(135deg,#fff,#c9d1dc 50%,#6f7a88);color:#1d2633}
.fcard.t-bronzo{background:linear-gradient(135deg,#ffd9b5,#c98a4b 50%,#6b3d14);color:#2e1606}
.fcard.t-viola{background:linear-gradient(135deg,#e9d6ff,#9b5cff 50%,#3d1491);color:#fff}
.fcard .fv{position:absolute;left:7%;top:5%;font:900 2.1em/1 var(--cond)}
.fcard .fr{position:absolute;left:9%;top:24%;font-weight:900;font-size:1.15em}
.fcard .fforma{position:absolute;right:6%;top:6%;width:52%;height:40%;background:#00000018;border-radius:.8em;display:flex;align-items:flex-end;justify-content:space-around;padding:.3em .3em 1.1em}
.fcard .fforma span{position:absolute;left:0;right:0;bottom:.2em;text-align:center;font-size:.62em;font-weight:800;opacity:.75;text-transform:uppercase}
.fcard .fb{width:.85em;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.fcard .fb i{display:block;width:100%;border-radius:.25em}
.fcard .fb small{font-size:.6em;font-weight:800;line-height:1.2}
.fcard .fnone{font-size:.7em;font-weight:700;opacity:.7;align-self:center;text-align:center}
.fcard .fn{position:absolute;left:6%;right:6%;top:52%;text-align:center;font:900 1.12em/1.3 var(--cond);letter-spacing:-.2px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid #0000002a;padding-top:.25em}
.fcard .fs{position:absolute;left:4%;right:4%;top:66%;text-align:center;font-weight:700;font-size:.85em;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;justify-items:center}
/* campo */
.campo{position:relative;border-radius:24px;background:repeating-linear-gradient(180deg,#3b1fa8 0 60px,#3417a0 60px 120px);border:2px solid #ffffff22;overflow:hidden;padding:26px 8px;display:flex;flex-direction:column;gap:30px}
.campo:before{content:"";position:absolute;inset:10px;border:2px solid #ffffff40;border-radius:8px;pointer-events:none}
.campo:after{content:"";position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px;border:2px solid #ffffff40;border-radius:50%;pointer-events:none}
.campo .linea{display:flex;justify-content:space-evenly;position:relative;z-index:1}
.panca{display:flex;gap:8px;overflow-x:auto;padding:8px 2px}
.lsel select{background:#0d0826cc;border:1px solid #ffffff2a;border-radius:16px;font-weight:800;font-size:17px;padding:10px 14px;margin:0}
.dhero{background:linear-gradient(160deg,#5b2bff,#2a0f8a 70%);border-radius:28px;padding:22px 16px 0;text-align:center;overflow:hidden;margin-bottom:14px}
.stemma{width:96px;height:96px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font:900 38px/1 var(--cond);color:#fff;border:4px solid #ffffff44;box-shadow:0 8px 24px #0006}
.dstats{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;color:#1a1240;border-radius:20px 20px 0 0;margin:16px -16px 0;padding:14px 4px}
.dstats div{border-right:1px solid #0001}.dstats div:last-child{border:0}.dstats b{display:block;font:800 26px/1.1 var(--cond)}.dstats small{color:#5b5680}
.vsr{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;text-align:center;gap:6px;margin:10px 0}.vsr .vs{width:46px;height:46px;border-radius:50%;background:#ffffff1a;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted)}
.mini{width:58px;height:58px;font-size:22px;border-width:3px;margin-bottom:6px}
.btnv{display:block;width:100%;background:var(--green);color:#06210f;border:0;border-radius:16px;padding:14px;font:800 18px Inter,sans-serif;margin-top:10px}
.ticker{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}.ticker div{flex:none;max-width:80%;background:#ffffff12;border-radius:16px;padding:10px 12px;cursor:pointer}.ticker b{color:#fff;background:var(--red);border-radius:8px;padding:2px 8px;margin-right:6px;font-size:12px}

let utente = null, profilo = null, pagina = 'home', chatCanale = null, FEAT = {};
async function caricaFeat(){const r=(await db.from('impostazioni').select('*')).data||[];FEAT={};r.forEach(x=>FEAT[x.chiave]=x.valore)}
const on=k=>FEAT[k]!=='0';

// ---------- utilità ----------
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m,err){const t=document.getElementById('toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3000)}
function chk(r){if(r.error){toast(r.error.message,true);throw r.error}return r.data}
function fmt(iso){return new Date(iso).toLocaleString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function val(id){return document.getElementById(id).value.trim()}
const ORD = {P:0,D:1,C:2,A:3};
function ruolo(r){return `<span class="ruolo r${r}">${r}</span>`}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toLocal(iso){const d=new Date(iso);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function foto(u){return u?`<img src="${esc(u)}" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;background:#fff">`:''}

// ---------- accesso ----------
db.auth.onAuthStateChange((ev,session)=>{
  if(ev==='TOKEN_REFRESHED') return;
  if(session && utente && session.user.id===utente.id && profilo) return;
  setTimeout(()=>avvia(session),0);
});

async function avvia(session){
  utente = session?.user || null;
  if(!utente){profilo=null;document.getElementById('top').style.display='none';renderAuth();return}
  const {data} = await db.from('profili').select('*').eq('id',utente.id).maybeSingle();
  profilo = data;
  if(!profilo) return schermata('Account non attivo','Il tuo account non è stato accettato.');
  if(!profilo.approvato) return schermata('In attesa di approvazione','La tua registrazione è arrivata. Un admin deve accettarla prima che tu possa entrare: riprova più tardi.');
  await caricaFeat();
  document.getElementById('top').style.display='block';
  await caricaLeghe();
  ping();if(!window._pingT){window._pingT=setInterval(ping,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)ping()})}
  REDT=!!((await db.from('redattori').select('utente_id').eq('utente_id',utente.id)).data||[]).length;
  if(pagina==='home') pagina='dash';
  {const m=location.hash.match(/^#art=(\d+)/);if(m){history.replaceState(null,'',location.pathname);setTimeout(()=>apriArtDa(+m[1]),500)}}
  renderNav(); vai(pagina);
  let visto=true;try{visto=!!localStorage.getItem('benv_'+utente.id)}catch(e){}
  if(!visto) setTimeout(mostraBenvenuto,500);
  else setTimeout(dopoBenv,700);
}
function dopoBenv(){let n=true;try{n=!!localStorage.getItem('nintro_'+utente.id)}catch(e){}
  if(!n)return mostraNotifIntro();
  if(on('f_sng')&&profilo.ultimo_pacco!==oggiStr()) mostraPacchi()}
function mostraNotifIntro(){if(document.getElementById('nintro'))return;const o=document.createElement('div');o.id='nintro';
  o.style.cssText='position:fixed;inset:0;z-index:101;background:#0b0628f0;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto';
  const P=premOk(),gia=('Notification' in window)&&Notification.permission==='granted';
  const vant=[['🔔','Notifiche live','gol, assist, cartellini, gol subiti e infortuni dei tuoi schierati, più il promemoria della formazione'],['🔴','Diretta live','fantavoti in diretta e simulazione del risultato'],['🪄','Consiglio formazione','la formazione migliore della tua rosa'],['⚠️','Allarme probabili','se un tuo titolare non è nelle probabili'],['📊','Titolarità e indisponibili','percentuali di titolarità, infortunati e squalificati'],['📋','Leghe illimitate','senza Premium al massimo 2'],['⚽','Calcetto','i tavoli con i palloni Premium']];
  o.innerHTML=`<div class="card" style="max-width:460px;width:100%;margin:auto">
    <div style="font-size:46px;text-align:center">🔔</div>
    <p style="font:800 26px var(--cond);margin:0;text-align:center">Novità: le notifiche live!</p>
    <p class="muted" style="text-align:center">Ti arriva un avviso sul telefono quando un tuo giocatore schierato <b>segna</b> ⚽, fa <b>assist</b> 🅰️, prende un <b>cartellino</b> 🟨🟥, il tuo portiere <b>subisce gol</b> 🥅 o un tuo giocatore si <b>infortuna</b> 🚑. E un promemoria ⏰ un'ora prima della scadenza se non hai messo la formazione.</p>
    <div class="card" style="margin:10px 0;border-color:var(--gold)"><b>💎 Sono riservate agli utenti Premium</b>${P?'<p style="color:var(--green);margin:6px 0 0">✅ Tu sei Premium: puoi attivarle subito.</p>':`<p class="muted" style="margin:6px 0 4px">Con il Premium ottieni:</p>${vant.map(v=>`<div style="font-size:14px;margin:4px 0">${v[0]} <b>${v[1]}</b> <span class="muted">· ${v[2]}</span></div>`).join('')}`}</div>
    ${P&&isIOS()&&!isApp()?'<p class="muted" style="font-size:13px">📱 Su iPhone prima devi aggiungere il sito alla schermata Home: ti spiego come nella pagina Notifiche.</p>':''}
    <p class="muted" style="font-size:13px">Puoi decidere tu: le attivi o le spegni quando vuoi da ☰ Altro → 🔔 Notifiche, e scegli quali avvisi ricevere.</p>
    ${P?(gia?'':`<button class="pri" style="width:100%" onclick="chiudiNIntro();${isIOS()&&!isApp()?"vai('notifiche')":'notifAttiva()'}">🔔 Sì, attiva le notifiche</button>`):`<button class="pri" style="width:100%" onclick="chiudiNIntro();vai('premium')">💎 Scopri il Premium</button>`}
    <button style="width:100%;margin-top:8px" onclick="chiudiNIntro()">${P&&gia?'Ok, perfetto':'Non ora'}</button></div>`;
  document.body.appendChild(o)}
function chiudiNIntro(){try{localStorage.setItem('nintro_'+utente.id,'1')}catch(e){}document.getElementById('nintro')?.remove();
  if(on('f_sng')&&profilo.ultimo_pacco!==oggiStr()) setTimeout(mostraPacchi,300)}
function mostraBenvenuto(){if(document.getElementById('benv'))return;const o=document.createElement('div');o.id='benv';
  o.style.cssText='position:fixed;inset:0;z-index:101;background:#0b0628f0;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto';
  o.innerHTML=`<div class="card" style="max-width:460px;width:100%;margin:auto">
    <p style="font:800 28px var(--cond);margin:0;text-align:center">👋 Benvenuto su FantaTaccuino!</p>
    <p class="muted" style="text-align:center">Prima di iniziare, come funzionano i palloni del Calcetto:</p>
    <div class="card" style="margin:10px 0;border-color:var(--green)"><b>🎁 Palloni gratis</b><p class="muted" style="margin:6px 0 0">Ne ricevi <b>100</b> in regalo, più un <b>pacco ogni giorno</b>. Servono per provare il Calcetto nei <b>tavoli 🎁 Gratis</b>. Quello che vinci lì non si accumula: è solo per divertirti e capire come funziona.</p></div>
    <div class="card" style="margin:10px 0;border-color:var(--gold)"><b>${'<span class="pd"></span>'} Palloni Premium</b><p class="muted" style="margin:6px 0 0">Servono per i <b>tavoli normali</b> del Calcetto, riservati agli utenti <b>💎 Premium</b>. Li assegna l'amministratore: non si comprano.</p></div>

function chiudiBenvenuto(){try{localStorage.setItem('benv_'+utente.id,'1')}catch(e){}document.getElementById('benv')?.remove();
  setTimeout(dopoBenv,300)}
function oggiStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mostraPacchi(){if(document.getElementById('pacchi'))return;const o=document.createElement('div');o.id='pacchi';
  o.style.cssText='position:fixed;inset:0;z-index:100;background:#0b0628e8;display:flex;align-items:center;justify-content:center;padding:20px';
  o.innerHTML=`<div class="card" style="max-width:420px;width:100%;text-align:center;margin:0"><p style="font:800 30px var(--cond);margin:0">🎁 Il regalo di oggi!</p><p class="muted">Scegli un pacco: dentro ci sono palloni gratis per i tavoli 🎁 del Calcetto.</p>
    <div id="pk" style="display:flex;justify-content:space-around;margin:18px 0">${[0,1,2].map(i=>`<div onclick="apriPacco(${i})" style="cursor:pointer;font-size:62px;animation:pk 1.4s ${i*.2}s ease-in-out infinite">🎁</div>`).join('')}</div>
    <p id="pk_msg" class="muted">Tocca un pacco</p><button id="pk_ok" style="display:none;width:100%" class="pri" onclick="document.getElementById('pacchi').remove()">Grazie!</button></div>`;
  document.body.appendChild(o)}
async function apriPacco(i){const box=document.getElementById('pk');if(box.dataset.aperto)return;box.dataset.aperto=1;
  const {data,error}=await db.rpc('apri_pacco');if(error){document.getElementById('pk_msg').textContent=error.message;document.getElementById('pk_ok').style.display='block';return}
  const altri=[...data.altri];const v=[0,1,2].map(k=>k===i?data.vinto:altri.shift());
  box.innerHTML=v.map((x,k)=>`<div style="text-align:center;${k===i?'':'opacity:.45'}"><div style="font-size:${k===i?54:40}px">${k===i?'🎉':'📦'}</div><b style="font:800 ${k===i?30:20}px var(--cond);color:${k===i?'var(--green)':'var(--muted)'}">+${x}</b></div>`).join('');
  document.getElementById('pk_msg').innerHTML=`Hai vinto <b style="color:var(--green)">${data.vinto} palloni gratis</b>! Torna domani per un altro pacco.`;
  document.getElementById('pk_ok').style.display='block';profilo.prova=data.saldo;profilo.ultimo_pacco=oggiStr();aggSaldo()}

function schermata(t,m){

  <div class="row"><button onclick="location.reload()">Riprova</button><button onclick="esci()">Esci</button></div></div>`;
}

  const P={squadre:[]},sqDi=n=>{let q=P.squadre.find(x=>norm(x.nome).trim()===norm(n).trim());if(!q){q={nome:String(n).trim()};P.squadre.push(q)}return q};let nomeF='',cosa=[];

          const RU=rosa.length===25?'PPPDDDDDDDDCCCCCCCCAAAAAA':null;sqDi(nome).rosa=rosa.map((x,i)=>RU?[x[0],x[1],RU[i]]:x);n++}
        cosa.push(`rose di ${n} squadre`);if(!nomeF)nomeF=f.name.replace(/\.xlsx?$/i,'').replace(/-rosters.*$/i,'').replace(/[-_]+/g,' ').trim();continue}
      const hi=M.findIndex(r=>r&&String(r[0]||'').trim().toLowerCase()==='pos');

        for(const r of M.slice(hi+1)){if(!r||!r[1])continue;sqDi(r[1]).pz={punti:+r[ix('pt.')]||0,fp:+r[ix('pt. totali')]||0,v:+r[ix('v')]||0,n:+r[ix('n')]||0,p:+r[ix('p')]||0,gf:+r[ix('gf')]||0,gs:+r[ix('gs')]||0};n++}
        cosa.push(`classifica di ${n} squadre`);continue}
      if(M.some(r=>r&&r.some(x=>/giornata lega/i.test(String(x||''))))){const G={};
        const cols=new Set();M.forEach(r=>r&&r.forEach((x,c)=>{if(/giornata lega/i.test(String(x||'')))cols.add(c)}));
        for(const c of cols){let cur=null;for(const r of M){if(!r)continue;const x=r[c];
          if(/giornata lega/i.test(String(x||''))){const ga=parseInt(String(r[c+2]||x));cur=G[ga]=G[ga]||[];continue}
          if(cur&&x&&r[c+3])cur.push([String(x).trim(),String(r[c+3]).trim(),String(r[c+4]??'').trim(),+r[c+1]||0,+r[c+2]||0])}}
        const gg=Object.keys(G).map(Number).sort((a,b)=>a-b).filter(g=>G[g].every(m=>!/\d/.test(m[2])));
        const gio=Object.keys(G).map(Number).sort((a,b)=>a-b).filter(g=>!gg.includes(g));if(gio.length){P.storico=gio.flatMap(g=>G[g].filter(m=>/\d/.test(m[2])).map(m=>[g,m[0],m[1],m[3],m[4],m[2]]));cosa.push(`risultati delle giornate ${gio[0]}-${gio[gio.length-1]}`)}
        if(gg.length){P.calendario={gg,giornate:gg.map(g=>G[g].map(m=>[m[0],m[1]]))};cosa.push(`calendario dalla giornata ${gg[0]} alla ${gg[gg.length-1]}`)}

    }}
  if(!cosa.length)return toast('Non riconosco questi file: usa quelli esportati da Leghe Fantacalcio (Rose, Classifica, Calendario)',true);

async function applicaPacchetto(lid,P){
  const rep=[],L=chk(await db.from('leghe').select('attesa,partenza').eq('id',lid).single()),at=L.attesa||{},pz0=L.partenza||{};
  const mem=chk(await db.from('membri_lega').select('utente_id,nome_squadra').eq('lega_id',lid));
  const memDi=n=>mem.find(m=>norm(m.nome_squadra).trim()===norm(n).trim());
  if(P.squadre&&P.squadre.some(q=>q.rosa)){
    const tutti=chk(await db.from('giocatori').select('id,nome,ruolo,squadra').eq('attivo',true).limit(3000));
    const parole=t=>norm(t).replace(/[.,()'\-]/g,' ').split(/\s+/).filter(Boolean);
    const presi=new Set(chk(await db.from('rose').select('giocatore_id').eq('lega_id',lid)).map(x=>x.giocatore_id));
    Object.entries(at).forEach(([k,v])=>{if(!P.squadre.some(q=>q.nome===k))(v.rosa||[]).forEach(r=>presi.add(r[0]))});
    for(const q of P.squadre){if(!q.rosa)continue;
      if(memDi(q.nome)){rep.push(`${q.nome}: ha già un utente, rosa non toccata`);continue}
      const ro=[];let nuovi=0,incerti=0;
      for(const [nome,prezzo,ru,sq] of q.rosa){
        const pw=parole(nome),lw=pw.filter(w=>w.length>2);
        const sc=g=>{const nw=parole(g.nome);if(nw.join(' ')===pw.join(' '))return 100;if(!lw.some(w=>nw.includes(w)))return 0;let p=0;for(const w of pw){if(nw.includes(w))p+=w.length>2?3:2;else if(nw.some(x=>x[0]===w[0]&&(x.length<=2||w.length<=2)))p+=1}return p};
        let c=tutti.filter(g=>!presi.has(g.id)&&(!ru||g.ruolo===ru)).map(g=>({g,b:sc(g)})).filter(x=>x.b>0).map(x=>({g:x.g,p:x.b+(sq&&x.g.squadra===sq?5:0)})).sort((a,b)=>b.p-a.p);
        let g=c[0]&&c[0].g;
        if(c.length>1&&c[1].p===c[0].p)incerti++;
        if(!g){if(ru&&sq){g=chk(await db.from('giocatori').insert({nome,ruolo:ru,squadra:sq,quotazione:1,attivo:true}).select().single());tutti.push(g);nuovi++}
          else{rep.push(`${q.nome}: ${nome} non trovato`);continue}}
        presi.add(g.id);ro.push([g.id,+prezzo||1]);
      }
      at[q.nome]={rosa:ro,pz:q.pz||(at[q.nome]&&at[q.nome].pz)||{}};
      rep.push(`${q.nome}: ${ro.length} giocatori${nuovi?` (${nuovi} aggiunti al listone)`:''}${incerti?` · ${incerti} da controllare`:''}`);
    }
  }
  (P.squadre||[]).forEach(q=>{if(!q.pz)return;const m=memDi(q.nome);if(m){pz0[m.utente_id]=q.pz}else if(at[q.nome]){at[q.nome].pz=q.pz}else rep.push(`${q.nome}: squadra non trovata per la classifica`)});
  if(P.squadre&&P.squadre.some(q=>q.pz))rep.push('Classifica di partenza: ok');
  let cal=null;
  if(P.calendario&&P.calendario.giornate&&P.calendario.giornate.length){
    const C=P.calendario,da=+C.da||1,a=+C.a||38,B=C.giornate,ok=n=>memDi(n)||at[n],subito=[],dopo=[];
    const nomiCal=[...new Set(B.flat(2))].filter(n=>!ok(n));if(nomiCal.length)rep.push('Calendario: squadre sconosciute '+nomiCal.join(', '));
    const GG=C.gg||Array.from({length:a-da+1},(_,i)=>da+i);
    GG.forEach((g,i)=>{const k=C.gg?i:g-da+(+C.offset||0),ciclo=C.gg?0:Math.floor(k/B.length);
      B[k%B.length].forEach(([x,y])=>{const c=ciclo%2?y:x,t=ciclo%2?x:y,mc=memDi(c),mt=memDi(t);
        if(mc&&mt)subito.push({lega_id:lid,giornata:g,casa:mc.utente_id,trasferta:mt.utente_id});else if(ok(c)&&ok(t))dopo.push([g,mc?mc.nome_squadra:c,mt?mt.nome_squadra:t])})});
    if(C.gg){chk(await db.from('incontri').delete().eq('lega_id',lid).in('giornata',GG));const Lc=chk(await db.from('leghe').select('attesa_cal').eq('id',lid).single());dopo.unshift(...(Lc.attesa_cal||[]).filter(x=>!GG.includes(x[0])))}
    else chk(await db.from('incontri').delete().eq('lega_id',lid));
    if(subito.length)chk(await db.from('incontri').insert(subito));
    cal=dopo;rep.push(`Calendario: giornate ${GG[0]}-${GG[GG.length-1]}, ${subito.length+dopo.length-(C.gg?dopo.length-dopo.filter(x=>GG.includes(x[0])).length:0)} partite`);
  }
  const up={attesa:at,partenza:pz0};if(cal)up.attesa_cal=cal;
  if(P.storico&&P.storico.length){up.storico=P.storico;rep.push(`Risultati giornate già giocate: ${P.storico.length} partite`)}
  chk(await db.from('leghe').update(up).eq('id',lid));
  return rep;
}

function golDa(pt,lega){const f=((lega.bonus&&lega.bonus.fasce)||[]).map(Number).filter(x=>x>0).sort((a,b)=>a-b);
  if(f.length){let n=f.filter(x=>pt>=x).length;if(n===f.length){const last=f[f.length-1],step=lega.passo_gol||4;n+=Math.floor((pt-last)/step)}return n}
  return pt<lega.soglia_gol?0:Math.floor((pt-lega.soglia_gol)/lega.passo_gol)+1}
function testoFasce(lega){const f=((lega.bonus&&lega.bonus.fasce)||[]);return f.length?`Fasce: ${f.join(' · ')} punti = 1, 2, 3… gol, poi uno ogni ${lega.passo_gol}`:`${lega.soglia_gol} punti = 1 gol, poi +1 ogni ${lega.passo_gol}`}
function golMatch(i,ris,lega){
  const A=ris[i.giornata]?.[i.casa]||{pt:0},B=ris[i.giornata]?.[i.trasferta]||{pt:0};
  let gc=golDa(A.pt,lega),gt=golDa(B.pt,lega);
  if(A.muro) gt=Math.max(0,gt-1);
  if(B.muro) gc=Math.max(0,gc-1);
  return [gc,gt,A.pt,B.pt];
}

const BONUS_DEF={gol_a:3,gol_c:3,gol_d:3,gol_p:3,rig:3,decisivo:0,pareggio:0,potm:0,assist:1,amm:-0.5,esp:-1,gs:-1,rp:3,rs:-3,ag:-2,inviolata:0,gs_dif:0,vittoria:0,novanta:0,moddif:0,modcen:0};
const BONUS_LAB=[['gol_a','⚽ Gol attaccante'],['gol_c','⚽ Gol centrocampista'],['gol_d','⚽ Gol difensore'],['gol_p','⚽ Gol portiere'],['rig','🎯 Gol su rigore (al posto del gol)'],['decisivo','⭐ Gol della vittoria (in più)'],['pareggio','🟰 Gol del pareggio (in più)'],['potm','🏅 Player of the match'],['assist','🅰️ Assist'],['amm','🟨 Ammonizione'],['esp','🟥 Espulsione'],['gs','🥅 Ogni gol subito (portiere)'],['rp','🧤 Rigore parato'],['rs','❌ Rigore sbagliato'],['ag','🙈 Autogol'],['inviolata','🔒 Porta inviolata (portiere)'],['gs_dif','🧱 Difensore: ogni gol subito dalla squadra'],['vittoria','🏆 Vittoria della squadra reale'],['novanta','⏱️ Partita intera (90 minuti)'],['moddif','🛡️ Modificatore difesa (1 = attivo, 0 = spento)'],['modcen','⚙️ Modificatore centrocampo (1 = attivo, 0 = spento)']];
function fvL(v,ruolo,B,ctx){if(!v||v.voto===null||v.voto===undefined)return null;B={...BONUS_DEF,...(B||{})};const R=(ruolo||'A').toLowerCase();
  const nr=Math.min(+v.rigori_segnati||0,+v.gol||0);
  let f=+v.voto+((+v.gol||0)-nr)*B['gol_'+R]+nr*B.rig+(+v.gol_decisivi||0)*B.decisivo+(+v.gol_pareggio||0)*B.pareggio+(v.potm?B.potm:0)+((+v.minuti||0)>=90?B.novanta:0)+(ctx&&ctx.res==='V'?B.vittoria:0)+(ctx&&ruolo==='D'?(ctx.gs||0)*B.gs_dif:0)+(+v.assist||0)*B.assist+(v.ammonizione?B.amm:0)+(v.espulsione?B.esp:0)+(+v.gol_subiti||0)*B.gs+(+v.rigori_parati||0)*B.rp+(+v.rigori_sbagliati||0)*B.rs+(+v.autogol||0)*B.ag;
  if(ruolo==='P'&&!(+v.gol_subiti)&&(+v.minuti||0)>0)f+=B.inviolata;return Math.round(f*100)/100}

async function impRoseLega(lid){
  const righe=document.getElementById('tr_rose').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!righe.length)return toast('Incolla le rose',true);
  const box=document.getElementById('tr_ris');box.innerHTML='<p class="muted">Abbino i giocatori…</p>';
  const lib=document.getElementById('tr_libere').checked;
  if(lib)return impRoseLibere(lid,righe,box);
  const membri=chk(await db.from('membri_lega').select('utente_id,nome_squadra').eq('lega_id',lid));
  const tutti=chk(await db.from('giocatori').select('id,nome,ruolo,squadra').eq('attivo',true).limit(2000));
  if(document.getElementById('tr_svuota').checked){if(!confirm('Svuotare tutte le rose di questa lega prima di importare?'))return;chk(await db.from('rose').delete().eq('lega_id',lid))}
  const presi=new Set(chk(await db.from('rose').select('giocatore_id').eq('lega_id',lid)).map(x=>x.giocatore_id));
  const parole=t=>norm(t).replace(/[.,()'\-]/g,' ').split(/\s+/).filter(Boolean);
  const ins=[],no=[],dubbi=[],conta={};
  let cur=null;
  for(const riga of righe){
    let sq,gn,pr;
    const head=membri.find(m=>norm(m.nome_squadra).trim()===norm(riga.replace(/[:\-–]+$/,'').trim()));
    if(head){cur=head.nome_squadra;continue}
    if(/[;\t]/.test(riga))[sq,gn,pr]=riga.split(/[;\t]/).map(x=>(x||'').trim());
    else{const m=riga.match(/^(.*?)[\s,]+(\d+)\s*$/);sq=cur||'';gn=(m?m[1]:riga).replace(/^[PDCA]\s+/,'').trim();pr=m?m[2]:''}
    const mem=membri.find(m=>norm(m.nome_squadra).trim()===norm(sq));
    if(!mem){no.push(`${riga} → squadra "${sq}" non trovata tra i partecipanti`);continue}
    if(!gn){no.push(riga+' → manca il giocatore');continue}
    const pw=parole(gn);
    const sc=g=>{const nw=parole(g.nome);if(nw.join(' ')===pw.join(' '))return 100;const lw=pw.filter(w=>w.length>2);if(!lw.some(w=>nw.includes(w)))return 0;let p=0;for(const w of pw){if(nw.includes(w))p+=w.length>2?3:2;else if(nw.some(x=>x[0]===w[0]&&(x.length<=2||w.length<=2)))p+=1}return p};
    const cand=tutti.map(g=>({g,p:sc(g)})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p);
    if(!cand.length){no.push(riga+' → giocatore non trovato nel listone');continue}
    const top=cand.filter(x=>x.p===cand[0].p);
    if(top.length>1){dubbi.push({riga,u:mem.utente_id,pr:+pr||1,c:top.slice(0,6).map(x=>x.g)});continue}
    const g=cand[0].g;if(presi.has(g.id)){no.push(`${riga} → ${g.nome} è già in un'altra rosa`);continue}
    presi.add(g.id);ins.push({lega_id:lid,utente_id:mem.utente_id,giocatore_id:g.id,prezzo:+pr||1});conta[mem.nome_squadra]=(conta[mem.nome_squadra]||0)+1;
  }
  for(let i=0;i<ins.length;i+=200) chk(await db.from('rose').insert(ins.slice(i,i+200)));
  box.innerHTML=`<p style="color:var(--green)">✅ Importati ${ins.length} giocatori${Object.keys(conta).length?': '+Object.entries(conta).map(([k,v])=>`${esc(k)} ${v}`).join(' · '):''}</p>`
    +dubbi.map(d=>`<div class="card" style="padding:10px"><b>❓ "${esc(d.riga)}"</b> – quale intendi?<br>${d.c.map(g=>`<button style="margin:4px 4px 0 0" onclick="assegnaT(${lid},'${d.u}',${g.id},${d.pr},this)">${g.ruolo} · ${esc(g.nome)} (${esc(g.squadra)})</button>`).join('')}</div>`).join('')
    +(no.length?`<div class="card" style="padding:10px;border-color:var(--red)"><b style="color:var(--red)">Da sistemare (${no.length})</b>${no.map(x=>`<div class="muted" style="font-size:13px">• ${esc(x)}</div>`).join('')}<p class="muted" style="font-size:12px">Correggi queste righe e importale di nuovo, senza spuntare "Svuota".</p></div>`:'');
}
async function impRoseLibere(lid,righe,box){
  const L=chk(await db.from('leghe').select('attesa').eq('id',lid).single()),at=L.attesa||{};
  const membri=chk(await db.from('membri_lega').select('nome_squadra').eq('lega_id',lid)).map(m=>norm(m.nome_squadra).trim());
  const tutti=chk(await db.from('giocatori').select('id,nome,ruolo,squadra').eq('attivo',true).limit(2000));
  const sv=document.getElementById('tr_svuota').checked;
  const presi=new Set(chk(await db.from('rose').select('giocatore_id').eq('lega_id',lid)).map(x=>x.giocatore_id));
  const parole=t=>norm(t).replace(/[.,()'\-]/g,' ').split(/\s+/).filter(Boolean);
  const no=[],dubbi=[],conta={},nuove={},lette={};let cur=null;
  for(const riga of righe){
    if(riga.includes(';')){no.push(riga+' → riga del listone, non di una rosa: saltata');continue}
    const m=riga.match(/^(.*?)[\s,]+(\d+)\s*$/);
    if(!m){cur=riga.replace(/[:\-–]+$/,'').trim();if(membri.includes(norm(cur).trim())){no.push(`"${cur}" è già una squadra con un utente: saltata`);cur=null;continue}
      if(sv||!at[cur])at[cur]={rosa:[],pz:(at[cur]&&at[cur].pz)||{}};nuove[cur]=1;continue}
    if(!cur){no.push(riga+' → manca il nome della squadra sopra');continue}
    lette[cur]=(lette[cur]||0)+1;
    const gn=m[1].replace(/^[PDCA]\s+/,'').trim(),pr=+m[2]||1,pw=parole(gn);
    const sc=g=>{const nw=parole(g.nome);if(nw.join(' ')===pw.join(' '))return 100;const lw=pw.filter(w=>w.length>2);if(!lw.some(w=>nw.includes(w)))return 0;let p=0;for(const w of pw){if(nw.includes(w))p+=w.length>2?3:2;else if(nw.some(x=>x[0]===w[0]&&(x.length<=2||w.length<=2)))p+=1}return p};
    const cand=tutti.map(g=>({g,p:sc(g)})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p);
    if(!cand.length){no.push(`${cur}: ${riga} → giocatore non trovato nel listone`);continue}
    const top=cand.filter(x=>x.p===cand[0].p);
    if(top.length>1){dubbi.push({riga,sq:cur,pr,c:top.slice(0,6).map(x=>x.g)});continue}
    const g=cand[0].g,giaA=Object.entries(at).find(([k,v])=>v.rosa.some(r=>r[0]===g.id));
    if(presi.has(g.id)||(giaA&&giaA[0]!==cur)){no.push(`${cur}: ${riga} → ${g.nome} è già in un'altra rosa`);continue}
    if(giaA){no.push(`${cur}: ${riga} → ${g.nome} è già in questa rosa (doppione)`);continue}
    at[cur].rosa.push([g.id,pr]);conta[cur]=(conta[cur]||0)+1;
  }
  chk(await db.from('leghe').update({attesa:at}).eq('id',lid));
  box.innerHTML=`<p style="color:var(--green)">✅ Squadre libere salvate: ${Object.keys(nuove).map(k=>`${esc(k)} ${(at[k].rosa||[]).length}/${lette[k]||0}`).join(' · ')}</p>`
    +dubbi.map(d=>`<div class="card" style="padding:10px"><b>❓ ${esc(d.sq)}: "${esc(d.riga)}"</b> – quale intendi?<br>${d.c.map(g=>`<button style="margin:4px 4px 0 0" onclick="assegnaA(${lid},decodeURIComponent('${encodeURIComponent(d.sq)}'),${g.id},${d.pr},this)">${g.ruolo} · ${esc(g.nome)} (${esc(g.squadra)})</button>`).join('')}</div>`).join('')
    +(no.length?`<div class="card" style="padding:10px;border-color:var(--red)"><b style="color:var(--red)">Da sistemare (${no.length})</b>${no.map(x=>`<div class="muted" style="font-size:13px">• ${esc(x)}</div>`).join('')}</div>`:'')
    +`<button class="pri" style="margin-top:8px" onclick="legaView()">Fatto, aggiorna la pagina</button>`;
}

async function datiLega(lega,membri,opt={}){
  let pub=opt.gg||chk(await db.from('fanta_giornate').select('numero').eq('pubblicata',true).order('numero')).map(g=>g.numero);
  if(lega.giornata_da) pub=pub.filter(g=>g>=lega.giornata_da&&(!lega.giornata_a||g<=lega.giornata_a));
  let form=chk(await db.from('formazioni').select('utente_id,giornata,giocatore_id,titolare,ordine,coppa').eq('lega_id',lega.id).in('coppa',[0,opt.coppa||0]));
  if(opt.coppa){const hc=new Set(form.filter(f=>f.coppa===opt.coppa).map(f=>f.utente_id+'-'+f.giornata));form=form.filter(f=>f.coppa===opt.coppa||!hc.has(f.utente_id+'-'+f.giornata))}
  const carte=lega.carte?chk(await db.from('carte_usate').select('*').eq('lega_id',lega.id)):[];
  const gids=[...new Set([...form.map(f=>f.giocatore_id),...carte.filter(c=>c.giocatore_id).map(c=>c.giocatore_id)])];
  const voti=gids.length?chk(await db.from('voti').select('giocatore_id,giornata,voto,minuti,gol,assist,ammonizione,espulsione,gol_subiti,rigori_parati,rigori_sbagliati,autogol,rigori_segnati,gol_decisivi,gol_pareggio,potm').in('giocatore_id',gids)):[];
  const partL=pub.length?chk(await db.from('partite_sa').select('giornata,casa,trasferta,gol_casa,gol_trasferta').in('giornata',pub)):[];
  const gioc=gids.length?chk(await db.from('giocatori').select('id,nome,ruolo,squadra,ruoli_m').in('id',gids)):[];
  const vm={};voti.forEach(v=>vm[v.giocatore_id+'-'+v.giornata]=v);
  const gm={};gioc.forEach(g=>gm[g.id]=g);
  const ctxOf=(sq,g)=>{const p=partL.find(x=>x.giornata===g&&(x.casa===sq||x.trasferta===sq));if(!p||p.gol_casa===null||p.gol_casa===undefined)return null;const mio=p.casa===sq?p.gol_casa:p.gol_trasferta,loro=p.casa===sq?p.gol_trasferta:p.gol_casa;return {res:mio>loro?'V':mio<loro?'P':'N',gs:loro}};
  const BL={...BONUS_DEF,...(lega.bonus||{})},RG=REG(lega);
  voti.forEach(v=>{const gi=gm[v.giocatore_id];v.fantavoto=fvL(v,gi?.ruolo,lega.bonus,ctxOf(gi?.squadra,v.giornata))});
  if(opt.extra)for(const g of pub)form.filter(f=>f.giornata===g).forEach(f=>{const k=f.giocatore_id+'-'+g;if(vm[k])return;const x=opt.extra(f.giocatore_id);if(!x)return;const v={giocatore_id:f.giocatore_id,giornata:g,minuti:90,gol:0,assist:0,ammonizione:false,espulsione:false,gol_subiti:0,rigori_parati:0,rigori_sbagliati:0,autogol:0,rigori_segnati:0,gol_decisivi:0,gol_pareggio:0,potm:false,...x};v.fantavoto=fvL(v,gm[f.giocatore_id]?.ruolo,lega.bonus,null);vm[k]=v});
  const cartaDi=(g,u,c)=>carte.find(x=>x.giornata===g&&x.utente_id===u&&x.carta===c);
  const SCH={};if(RG.sistema==='ruoli'){chk(await db.from('schieramenti').select('utente_id,giornata,modulo,coppa').eq('lega_id',lega.id).in('coppa',[0,opt.coppa||0])).forEach(x=>{const k=x.utente_id+'-'+x.giornata;if(!SCH[k]||x.coppa)SCH[k]=x.modulo})}
  const ris={};
  for(const g of pub){
    ris[g]={};
    for(const m of membri){
      const uid=m.utente_id;
      let mie=form.filter(f=>f.utente_id===uid&&f.giornata===g);let recup=null;
      if(!mie.length&&RG.nonsch==='precedente'){const prec=form.filter(f=>f.utente_id===uid&&f.giornata<g).map(f=>f.giornata);if(prec.length){recup=Math.max(...prec);mie=form.filter(f=>f.utente_id===uid&&f.giornata===recup)}}
      if(!mie.length){ris[g][uid]={pt:0,righe:[],extra:[],vuota:true,muro:!!cartaDi(g,uid,'muro')};continue}
      const maxCambi=(+RG.cambi||0)+(cartaDi(g,uid,'panchina')?2:0);const cnt={D:0,C:0,A:0};
      const tit=mie.filter(f=>f.titolare).sort((a,b)=>ORD[gm[a.giocatore_id]?.ruolo]-ORD[gm[b.giocatore_id]?.ruolo]);
      const pan=mie.filter(f=>!f.titolare).sort((a,b)=>a.ordine-b.ordine);
      const usati=new Set();let cambi=0,pt=0;const righe=[],extra=[],inCampo=new Set();
      tit.forEach(t=>{const rr=gm[t.giocatore_id]?.ruolo;if(cnt[rr]!==undefined)cnt[rr]++});
      if(RG.sistema==='ruoli'){const MD=MODR[SCH[uid+'-'+(recup||g)]]||MODR['4-3-3'],mancanti=[];
        for(const t of [...tit].sort((a,b)=>a.ordine-b.ordine)){const gi=gm[t.giocatore_id],v=vm[t.giocatore_id+'-'+g];
          if(v&&v.fantavoto!==null){pt+=Number(v.fantavoto);righe.push({g:gi,fv:Number(v.fantavoto)});inCampo.add(t.giocatore_id)}else mancanti.push(t)}
        const adatto=(p,S,fr)=>{const Rr=RMG(gm[p.giocatore_id]);if(S.includes('Por')||Rr.includes('Por'))return !fr&&S.includes('Por')&&Rr.includes('Por');return fr?Rr.some(r=>S.some(x=>(VIC[x]||[]).includes(r))):Rr.some(r=>S.includes(r))};
        const sost={};
        for(const fr of [false,true])for(const t of mancanti){if(sost[t.giocatore_id]||cambi>=maxCambi)continue;const S=MD[t.ordine]||[];
          for(const p of pan){if(usati.has(p.giocatore_id))continue;const vp=vm[p.giocatore_id+'-'+g];if(!vp||vp.fantavoto===null)continue;
            if(adatto(p,S,fr)){sost[t.giocatore_id]={g:gm[p.giocatore_id],fv:Number(vp.fantavoto)-(fr?1:0),fr};usati.add(p.giocatore_id);inCampo.add(p.giocatore_id);cambi++;break}}}
        for(const t of mancanti){const gi=gm[t.giocatore_id],e=sost[t.giocatore_id];
          if(!e&&RG.riserva){pt+=+RG.riserva_voto;righe.push({g:gi,fv:+RG.riserva_voto,uff:true});continue}
          righe.push({g:gi,fv:null,sv:true});if(e){pt+=e.fv;righe.push({...e,entra:true})}}
      } else
      for(const t of tit){
        const gi=gm[t.giocatore_id],v=vm[t.giocatore_id+'-'+g];
        if(v&&v.fantavoto!==null){pt+=Number(v.fantavoto);righe.push({g:gi,fv:Number(v.fantavoto)});inCampo.add(t.giocatore_id);continue}
        let entrato=null;
        if(cambi<maxCambi){
          for(const p of pan){
            if(usati.has(p.giocatore_id))continue;
            const gp=gm[p.giocatore_id],vp=vm[p.giocatore_id+'-'+g];
            if(gp?.ruolo===gi?.ruolo&&vp&&vp.fantavoto!==null){entrato={g:gp,fv:Number(vp.fantavoto)};usati.add(p.giocatore_id);inCampo.add(p.giocatore_id);cambi++;break}
          }
          if(!entrato&&RG.sw&&gi?.ruolo!=='P'){
            for(const p of pan){
              if(usati.has(p.giocatore_id))continue;
              const gp=gm[p.giocatore_id],vp=vm[p.giocatore_id+'-'+g];
              if(!gp||gp.ruolo==='P'||gp.ruolo===gi.ruolo||!vp||vp.fantavoto===null)continue;
              const c2={...cnt};c2[gi.ruolo]--;c2[gp.ruolo]++;
              if(RG.moduli.includes(`${c2.D}-${c2.C}-${c2.A}`)){entrato={g:gp,fv:Number(vp.fantavoto),sw:true};Object.assign(cnt,c2);usati.add(p.giocatore_id);inCampo.add(p.giocatore_id);cambi++;break}
            }
          }
        }
        if(!entrato&&RG.riserva){pt+=+RG.riserva_voto;righe.push({g:gi,fv:+RG.riserva_voto,uff:true});continue}
        righe.push({g:gi,fv:null,sv:true});
        if(entrato){pt+=entrato.fv;righe.push({...entrato,entra:true})}
      }
      if(BL.moddif||BL.modcen){const vv=[...inCampo].map(id=>({r:gm[id]?.ruolo,v:Number(vm[id+'-'+g]?.voto)})).filter(x=>x.v>0);
        if(BL.moddif){const P=vv.filter(x=>x.r==='P'),D=vv.filter(x=>x.r==='D').sort((a,b)=>b.v-a.v);if(P.length&&D.length>=4){const m=(P[0].v+D[0].v+D[1].v+D[2].v)/4,b=m>=7?6:m>=6.5?3:m>=6?1:0;if(b){pt+=b;extra.push(`🛡️ Modificatore difesa (media ${m.toFixed(2)}): +${b}`)}}}
        if(BL.modcen){const C=vv.filter(x=>x.r==='C');if(C.length){const m=C.reduce((a,x)=>a+x.v,0)/C.length,b=m>=7?3:m>=6.5?2:m>=6?1:0;if(b){pt+=b;extra.push(`⚙️ Modificatore centrocampo (media ${m.toFixed(2)}): +${b}`)}}}}
      const cap=cartaDi(g,uid,'capitano');
      if(cap){const v=vm[cap.giocatore_id+'-'+g],n=gm[cap.giocatore_id]?.nome;
        if(v&&v.voto!==null&&inCampo.has(cap.giocatore_id)){const b=Math.round((Number(v.fantavoto)-Number(v.voto))*10)/10;pt+=b;extra.push(`👑 Capitano ${esc(n)}: ${b>=0?'+':''}${b}`)}

      if(sc){const v=vm[sc.giocatore_id+'-'+g],n=gm[sc.giocatore_id]?.nome;let b=0;

      const muro=!!cartaDi(g,uid,'muro');if(muro) extra.push('🧱 Muro: annulla un gol avversario');

      ris[g][uid]={pt:Math.round(pt*10)/10,righe,extra,muro};
    }
  }
  return {pub,ris};
}

function roundRobin(ids){
  const t=[...ids];if(t.length%2)t.push(null);
  const n=t.length,giri=[];
  for(let r=0;r<n-1;r++){
    const m=[];
    for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)m.push(r%2?[b,a]:[a,b])}
    giri.push(m);t.splice(1,0,t.pop());
  }
  return giri;
}

  chk(await db.from('incontri').insert(righe));
  toast('Calendario generato!');legaView();
}

const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
async function importaOmbra(lid){
  const righe=document.getElementById('om_t').value.split('\n').map(r=>r.trim()).filter(Boolean);
  if(!righe.length)return;
  const box=document.getElementById('om_r');box.innerHTML='<p class="muted">Cerco i giocatori…</p>';
  const presi=new Set(chk(await db.from('rose').select('giocatore_id').eq('lega_id',lid)).map(x=>x.giocatore_id));
  const ok=[],dubbi=[],no=[];
  for(const riga of righe){
    const nome=riga.split(';')[0].replace(/[0-9]/g,' ');
    const parole=norm(nome).replace(/[.,()\-]/g,' ').split(/\s+/).filter(w=>w.length>1);
    if(!parole.length)continue;
    const chiave=[...parole].sort((a,b)=>b.length-a.length)[0];
    const cand=chk(await db.rpc('cerca_giocatori',{p_q:chiave})).filter(g=>!presi.has(g.id));
    const punti=g=>{const n=norm(g.nome);return parole.reduce((s,w)=>s+(n.includes(w)?2:(w.length<=2&&n.startsWith(w[0]))?1:0),0)};
    cand.forEach(g=>g._p=punti(g));cand.sort((a,b)=>b._p-a._p);
    if(!cand.length){no.push(riga);continue}
    if(cand.length===1||cand[0]._p>cand[1]._p){
      const g=cand[0];const {error}=await db.from('rose').insert({lega_id:lid,utente_id:utente.id,giocatore_id:g.id,prezzo:1});
      if(error) no.push(riga+' ('+error.message+')'); else {ok.push(g.nome);presi.add(g.id)}
    } else dubbi.push({riga,cand:cand.filter(c=>c._p===cand[0]._p).slice(0,6)});
  }
  box.innerHTML=(ok.length?`<p style="color:var(--green)">✅ Aggiunti (${ok.length}): ${ok.map(esc).join(', ')}</p>`:'')
    +dubbi.map(d=>`<div class="card" style="padding:10px"><b>❓ "${esc(d.riga)}"</b>: quale intendi?<br>${d.cand.map(g=>`<button style="margin:4px 4px 0 0" onclick="aggOmbra(${lid},${g.id},this)">${g.ruolo} · ${esc(g.nome)} (${esc(g.squadra)})</button>`).join('')}</div>`).join('')
    +(no.length?`<p style="color:var(--red)">❌ Non trovati: ${no.map(esc).join(', ')}. Cercali a mano qui sotto.</p>`:'');
}

function spiega(r,st,gc){
  if(!st) return null;
  const n=(...p)=>{let x=st;for(const k of p)x=x?.[k];return Number(x)||0};
  const mins=n('games','minutes'),gol=n('goals','total'),ass=n('goals','assists');
  if(mins<15&&!gol&&!ass) return ['Meno di 15 minuti senza gol né assist: s.v.'];
  let v=6;const L=['Base: 6'];const add=(d,t)=>{v+=d;L.push(`${d>0?'+':''}${String(d).replace('.',',')} ${t}`)};
  if(r==='P'){const pz=Math.floor(n('goals','saves')/3)*0.5;if(pz)add(pz,`${n('goals','saves')} parate`);if(gc===0&&mins>=60)add(0.5,'porta inviolata');if(gc>=3)add(-0.5,'la squadra ha subito 3+ gol')}
  else if(r==='D'){if(gc===0&&mins>=60)add(0.5,'porta inviolata');const dif=n('tackles','total')+n('tackles','interceptions')+n('tackles','blocks');if(dif>=6)add(0.5,`${dif} azioni difensive`);const dt=n('duels','total');if(dt>=6&&n('duels','won')/dt>=0.6)add(0.5,`duelli vinti ${n('duels','won')}/${dt}`);if(n('dribbles','past')>=3)add(-0.5,`saltato ${n('dribbles','past')} volte`);if(gc>=3)add(-0.5,'la squadra ha subito 3+ gol');if(n('penalty','commited')>=1)add(-1,'rigore causato')}
  else if(r==='C'){const k=n('passes','key');if(k>=4)add(1,`${k} passaggi chiave`);else if(k>=2)add(0.5,`${k} passaggi chiave`);const tot=n('passes','total'),acc=n('passes','accuracy');const pct=tot?(acc<=tot?100*acc/tot:acc):null;if(pct!==null&&pct>=88&&tot>=30)add(0.5,`precisione passaggi ${Math.round(pct)}%`);if(pct!==null&&pct<70&&tot>=20)add(-0.5,`precisione passaggi ${Math.round(pct)}%`);const tk=n('tackles','total')+n('tackles','interceptions');if(tk>=4)add(0.5,`${tk} contrasti e intercetti`);if(n('dribbles','success')>=3)add(0.5,`${n('dribbles','success')} dribbling riusciti`)}
  else{if(n('shots','on')>=3)add(0.5,`${n('shots','on')} tiri in porta`);if(n('passes','key')>=2)add(0.5,`${n('passes','key')} passaggi chiave`);if(n('dribbles','success')>=3)add(0.5,`${n('dribbles','success')} dribbling riusciti`);if(n('penalty','won')>=1)add(0.5,'rigore procurato');if(mins>=60&&n('shots','total')===0)add(-0.5,'nessun tiro in 60+ minuti')}
  const max=(gol||ass)?9:7.5;if(v>max)L.push(`Tetto massimo ${String(max).replace('.',',')}${max===7.5?' senza gol né assist':''}`);if(v<4)L.push('Voto minimo 4');
  return L;
}
function bonusRighe(v){const b=[];
  if(v.gol)b.push(`+${3*v.gol} gol (${v.gol})`);if(v.assist)b.push(`+${v.assist} assist`);if(v.ammonizione)b.push('-0,5 ammonizione');if(v.espulsione)b.push('-1 espulsione');
  if(v.gol_subiti)b.push(`-${v.gol_subiti} gol subiti`);if(v.rigori_parati)b.push(`+${3*v.rigori_parati} rigori parati`);if(v.rigori_sbagliati)b.push(`-${3*v.rigori_sbagliati} rigori sbagliati`);if(v.autogol)b.push(`-${2*v.autogol} autogol`);return b}
function cartaG(g,fv,w=112){fv=(fv||[]).filter(x=>x!==null&&x!==undefined).map(Number);const q=g.quotazione||1;const t=q>=30?'viola':q>=15?'oro':q>=8?'argento':'bronzo';
  const fm=fv.length?(fv.reduce((a,b)=>a+b,0)/fv.length).toFixed(1):'–';const col=x=>x>=7?'#16a34a':x>=6?'#eab308':'#e5484d';
  const bars=fv.length?fv.slice(-5).map(x=>`<div class="fb"><small>${+x.toFixed(1)}</small><i style="height:${Math.max(6,Math.min(80,x*6.5))}%;background:${col(x)}"></i></div>`).join(''):'<div class="fnone">nessun<br>voto</div>';

function titG(g,mini){if(!g)return '';const st={infortunato:'<span style="color:var(--red);font-weight:800">✚ Infortunato</span>',squalificato:'<span style="color:var(--red);font-weight:800">🟥 Squalificato</span>',dubbio:'<span style="color:var(--gold);font-weight:800">❓ In dubbio</span>'}[g.stato];

async function schedaG(id){
  const g=chk(await db.from('giocatori').select('*').eq('id',id).single());
  const vv=chk(await db.from('voti').select('*').eq('giocatore_id',id).order('giornata'));
  const giocate=vv.filter(v=>v.voto!==null);
  const media=k=>giocate.length?(giocate.reduce((s,v)=>s+Number(v[k]),0)/giocate.length).toFixed(2):'-';
  const somma=k=>vv.reduce((s,v)=>s+Number(v[k]||0),0);
  let pp=[];
  if(on('f_voto_spiegato')&&premOk()&&vv.length){const q=JSON.stringify(g.squadra);pp=chk(await db.from('partite_sa').select('*').in('giornata',vv.map(v=>v.giornata)).or(`casa.eq.${q},trasferta.eq.${q}`))}
  const gcDi=gn=>{const p=pp.find(x=>x.giornata===gn);if(!p||p.gol_casa===null)return null;return p.casa===g.squadra?p.gol_trasferta:p.gol_casa};
  const avv=gn=>{const p=pp.find(x=>x.giornata===gn);return p?(p.casa===g.squadra?'vs '+p.trasferta:'@ '+p.casa):''};
  let graf='';
  if(premOk()){
    const qs=chk(await db.from('quot_storia').select('giornata,quotazione').eq('giocatore_id',id).order('giornata'));
    const pv=giocate.filter(v=>v.fantavoto!==null).map(v=>({x:'G'+v.giornata,y:+v.fantavoto}));
    const pq=[{x:'Inizio',y:g.quot_iniziale??g.quotazione},...qs.map(q=>({x:'G'+q.giornata,y:q.quotazione}))];
    const a=grafico(pv,'#5dff7a','Fantavoto giornata per giornata'),b=grafico(pq,'#ffd447','Quotazione');
    graf=`<div class="card" style="border-color:var(--gold)"><h3>💎 Andamento</h3>${a||'<p class="muted">Il grafico dei voti compare dopo almeno 2 partite giocate.</p>'}${b||'<p class="muted">Il grafico della quotazione compare dopo la prima giornata pubblicata.</p>'}</div>`;
  } else graf='<div class="card" style="border-color:var(--gold)"><p class="muted">💎 Con il Premium vedi i grafici di voti e quotazione giornata per giornata.</p></div>';
  app.innerHTML=`<button onclick="pGiocatori()">← Giocatori</button>
  <div class="card" style="margin-top:12px"><div class="scheda">${g.foto?`<img src="${esc(g.foto)}" alt="">`:''}<div><h2 style="margin:0">${esc(g.nome)}</h2>
    <div style="margin-top:6px">${ruolo(g.ruolo)}${esc(g.squadra)} · <b>${qv(g)}</b>${g.var_q?` <small class="muted">(inizio stagione ${g.quot_iniziale})</small>`:''}</div></div></div>
    <div class="stat"><div><b>${giocate.length}</b>Presenze</div><div><b>${media('voto')}</b>Media voto</div><div><b>${media('fantavoto')}</b>Fantamedia</div>
    <div><b>${somma('gol')}</b>Gol</div><div><b>${somma('assist')}</b>Assist</div><div><b>${vv.filter(v=>v.ammonizione).length}/${vv.filter(v=>v.espulsione).length}</b>Amm/Esp</div></div></div>
  ${graf}<div class="card"><h3>Voti giornata per giornata</h3>${on('f_voto_spiegato')?(premOk()?'<p class="muted" style="font-size:12px">🔍 Tocca una giornata per vedere come è nato il voto.</p>':'<p class="muted" style="font-size:12px">💎 Con il Premium vedi da cosa nasce ogni voto.</p>'):''}
  ${vv.slice().reverse().map(v=>{const sp=on('f_voto_spiegato')&&premOk()?(spiega(g.ruolo,v.statistiche,gcDi(v.giornata))||['Le statistiche dettagliate di questa partita non sono disponibili: qui sotto vedi il voto in pagella e i bonus/malus.']):null;const bn=bonusRighe(v);
    const testa=`<div class="row between" style="width:100%"><span><b>G${v.giornata}</b> <small class="muted">${esc(avv(v.giornata))} · ${v.minuti??0}'</small></span><span>Voto <b>${v.voto??'s.v.'}</b> · Fanta <b style="color:var(--gold)">${v.fantavoto??'-'}</b></span></div>`;
    if(!sp) return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">${testa}${v.giudizio?`<div style="font-style:italic;margin-top:3px">"${esc(v.giudizio)}"</div>`:''}</div>`;
    return `<details style="padding:8px 0;border-bottom:1px solid var(--line)"><summary style="color:var(--txt)">${testa}</summary><div style="padding:8px 0 0 10px">

      ${sp.map(x=>`<div class="muted">${esc(x)}</div>`).join('')}<div style="margin-top:4px"><b>= Voto ${v.voto??'s.v.'}</b></div>
      ${bn.length?`<div style="margin-top:6px">${bn.map(x=>`<div class="muted">${x}</div>`).join('')}</div><div style="margin-top:4px"><b>= Fantavoto ${v.fantavoto??'-'}</b></div>`:''}</div></details>`}).join('')||'<p class="muted">Nessun voto pubblicato.</p>'}</div>`;
}

function isPrem(){return profilo&&(profilo.ruolo==='admin'||(profilo.premium_fino&&profilo.premium_fino>=new Date().toISOString().slice(0,10)))}
function montepremi(t){return Math.floor(t.ingresso*t.posti*(100-(+FEAT.rake_calcetto||0))/100)}
function premOk(){return !on('f_premium')||isPrem()}
function dia(p){return on('f_premium')&&p?.premium_fino&&p.premium_fino>=new Date().toISOString().slice(0,10)?' <span title="Premium" style="font-size:.85em">💎</span>':''}
function un(p){return esc(p?.username||'?')+dia(p)}
function grafico(pts,col,tit,minY,maxY){if(pts.length<2)return '';const W=320,H=120,L=26,B=18,ys=pts.map(p=>p.y);const lo=minY??Math.floor(Math.min(...ys)),hi=maxY??Math.ceil(Math.max(...ys));const sp=(hi-lo)||1;
  const X=i=>L+i*(W-L-8)/(pts.length-1),Y=v=>8+(H-B-8)*(1-(v-lo)/sp);
  const linee=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-4}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ffffff22"/><text x="${L-4}" y="${Y(v)+4}" fill="#c9c3ee" font-size="10" text-anchor="end">${+v.toFixed(1)}</text>`).join('');
  const et=pts.map((p,i)=>i%Math.ceil(pts.length/8)===0||i===pts.length-1?`<text x="${X(i)}" y="${H-4}" fill="#c9c3ee" font-size="10" text-anchor="middle">${p.x}</text>`:'').join('');
  return `<div style="margin-top:8px"><small class="muted">${tit}</small><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${linee}${et}<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.map((p,i)=>X(i)+','+Y(p.y)).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="3" fill="${col}"/>`).join('')}</svg></div>`}
function boxPremium(cosa){return `<div class="card" style="border-color:var(--gold)"><h3>💎 ${cosa} è per gli utenti Premium</h3><p class="muted">Il Premium FantaTaccuino sblocca il Calcetto, leghe illimitate, voto spiegato, consiglio formazione, allarme probabili, grafici dei giocatori e il badge 💎. Per attivarlo contatta l'admin.</p></div>`}

async function salvaTavolo(id,vuoto){
  const cp=[...document.querySelectorAll('.mp:checked')];
  if(!cp.length) return toast('Scegli almeno una partita',true);
  const o={nome:val('mt_nome')||null,partite:cp.map(x=>+x.value),chiusura:cp.map(x=>x.dataset.d).sort()[0]};
  if(vuoto){o.posti=+val('mt_posti');o.ingresso=+val('mt_ing')||0}
  const maxP=o.partite.length===1?2:o.partite.length===2?4:o.partite.length===3?6:8;
  if((o.posti||0)>maxP) return toast(`Con ${o.partite.length} partit${o.partite.length===1?'a':'e'} il tavolo può essere al massimo da ${maxP}`,true);

}
async function eliminaTavolo(id){
  if(!confirm('Eliminare il tavolo? Chi era iscritto riavrà i suoi palloni dorati.'))return;
  const t=chk(await db.from('sng_tavoli').select('ingresso,stato').eq('id',id).single());
  if(['aperto','draft','in_gioco'].includes(t.stato)){
    const isc=chk(await db.from('sng_iscritti').select('utente_id,prova, profili(gettoni,prova)').eq('tavolo_id',id));
    for(const i of isc) chk(await db.from('profili').update(i.prova?{prova:(i.profili?.prova||0)+t.ingresso}:{gettoni:(i.profili?.gettoni||0)+t.ingresso}).eq('id',i.utente_id));
  }
  chk(await db.from('sng_tavoli').delete().eq('id',id));
  toast('Tavolo eliminato');pSng();
}
async function creaTavoli(){

  const nome=val('ct_nome')||null;

function votoProposto(r){
  const ev=(+r.gol||0)+(+r.assist||0);
  if((+r.minuti||0)<15&&!ev&&!r.espulsione&&!r.rigori_parati) return null;
  let v=6+0.5*Math.min(ev,2);
  if(r.espulsione)v-=1;if(r.rigori_sbagliati)v-=0.5;if(r.autogol)v-=0.5;
  if(r.ruolo==='P'){if(+r.gol_subiti===0&&r.minuti>=60)v+=0.5;if(r.gol_subiti>=3)v-=0.5;if(r.rigori_parati)v+=0.5}
  return Math.max(4,Math.min(9,v));
}

function proponi(){if(!confirm('Ricalcolare tutti i voti proposti? I ritocchi fatti a mano verranno persi.'))return;red.righe.forEach(r=>r.voto=votoProposto(r));redRender()}
function abbina(nome,lato){
  const w=norm(nome).replace(/[.,]/g,' ').split(/\s+/).filter(x=>x.length>2);
  const c=red.tutti.filter(x=>x.lato===lato&&w.some(p=>norm(x.nome).includes(p)));
  return c.length===1?c[0]:null;
}
function caricaTabellino(d){
  if(d.risultato){if(d.risultato.casa!=null)red.ris.casa=+d.risultato.casa;if(d.risultato.trasferta!=null)red.ris.trasf=+d.risultato.trasferta}
  let n=0;
  for(const x of d.giocatori||[]){
    const lato=x.squadra==='trasferta'?'trasferta':'casa';
    let g=x.id?red.tutti.find(t=>t.id===+x.id&&t.lato===lato):null;
    if(!g) g=abbina(x.nome||'',lato);
    if(g&&red.righe.find(r=>r.id===g.id))continue;
    const r={id:g?.id||null,nome:g?.nome||x.nome||'?',ruolo:g?.ruolo||'C',lato,minuti:+x.minuti||0,gol:+x.gol||0,assist:+x.assist||0,
      ammonizione:!!x.ammonizione,espulsione:!!x.espulsione,gol_subiti:+x.gol_subiti||0,rigori_parati:+x.rigori_parati||0,
      rigori_sbagliati:+x.rigori_sbagliati||0,autogol:+x.autogol||0,rigori_segnati:+x.rigori_segnati||0,gol_decisivi:+(x.gol_vittoria??x.gol_decisivi)||0,gol_pareggio:+x.gol_pareggio||0,potm:!!(x.potm||x.player_of_the_match),giudizio:''};
    red.righe.push(r);n++;
  }
  // gol subiti al portiere se è l'unico della sua squadra
  for(const [l,avv] of [['casa','trasf'],['trasferta','casa']]){
    const pt=red.righe.filter(r=>r.lato===l&&r.ruolo==='P');
    if(pt.length===1&&red.ris[avv]!=null) pt[0].gol_subiti=red.ris[avv];
  }
  red.righe.forEach(r=>{if(r.voto===undefined)r.voto=votoProposto(r)});
  return n;
}
function importaTesto(){
  try{const t=val('red_txt').replace(/^```(json)?/,'').replace(/```$/,'').trim();const n=caricaTabellino(JSON.parse(t));toast(n+' giocatori importati');redRender()}
  catch(e){toast('Testo non valido: '+e.message,true)}
}
async function salvaPartita(){
  const {p}=red;
  for(const r of red.righe){
    if(!r.id&&!r.nuovoRuolo) return toast(`Associa "${r.nome}" a un giocatore o crealo nuovo`,true);
  }
  for(const r of red.righe.filter(r=>!r.id)){
    const g=chk(await db.from('giocatori').insert({nome:r.nome,ruolo:r.nuovoRuolo,squadra:r.lato==='casa'?p.casa:p.trasferta}).select().single());
    r.id=g.id;delete r.nuovoRuolo;
  }
  const righe=red.righe.map(r=>({giocatore_id:r.id,giornata:p.giornata,voto:r.voto,voto_auto:votoProposto(r),minuti:+r.minuti||0,gol:+r.gol||0,assist:+r.assist||0,
    ammonizione:!!r.ammonizione&&!r.espulsione,espulsione:!!r.espulsione,gol_subiti:+r.gol_subiti||0,rigori_parati:+r.rigori_parati||0,
    rigori_sbagliati:+r.rigori_sbagliati||0,autogol:+r.autogol||0,rigori_segnati:Math.min(+r.rigori_segnati||0,+r.gol||0),gol_decisivi:Math.min(+r.gol_decisivi||0,+r.gol||0),gol_pareggio:Math.min(+r.gol_pareggio||0,+r.gol||0),potm:!!r.potm,giudizio:r.giudizio||null,corretto:true}));
  const tutti=[...red.casa,...red.trasf].map(x=>x.id),tenuti=new Set(righe.map(r=>r.giocatore_id));
  const via=tutti.filter(id=>!tenuti.has(id));
  if(via.length) chk(await db.from('voti').delete().eq('giornata',p.giornata).in('giocatore_id',via));
  if(righe.length) chk(await db.from('voti').upsert(righe,{onConflict:'giocatore_id,giornata'}));
  chk(await db.from('partite_sa').update({stato_red:'pronta',gol_casa:red.ris.casa,gol_trasferta:red.ris.trasf,stato:'FT'}).eq('api_id',p.api_id));
  toast('Partita salvata ✅');red=null;pAdmin();
}

let prb=null;
async function probApri(id){
  const p=chk(await db.from('partite_sa').select('*').eq('api_id',id).single());
  const gg=chk(await db.from('giocatori').select('id,nome,ruolo,squadra').in('squadra',[p.casa,p.trasferta]).eq('attivo',true));
  const ex=chk(await db.from('probabili').select('giocatore_id').eq('partita_id',id)).map(x=>x.giocatore_id);
  let sel=new Set(ex),proposta=false;
  if(!ex.length){
    const vv=chk(await db.from('voti').select('giocatore_id,minuti,giornata').in('giocatore_id',gg.map(g=>g.id)).lt('giornata',p.giornata).gte('giornata',p.giornata-3));
    const min={};vv.forEach(v=>min[v.giocatore_id]=(min[v.giocatore_id]||0)+(v.minuti||0));
    for(const sq of [p.casa,p.trasferta]){
      const t=gg.filter(g=>g.squadra===sq&&min[g.id]).sort((a,b)=>min[b.id]-min[a.id]);
      const P=t.filter(g=>g.ruolo==='P').slice(0,1),A=t.filter(g=>g.ruolo!=='P').slice(0,10);
      [...P,...A].forEach(g=>sel.add(g.id));
    }
    proposta=sel.size>0;
  }
  prb={p,gg,sel,proposta};probRender();
}
function probRender(){
  const {p,gg,sel,proposta}=prb;
  const blocco=sq=>{const l=gg.filter(g=>g.squadra===sq).sort((a,b)=>ORD[a.ruolo]-ORD[b.ruolo]||a.nome.localeCompare(b.nome));
    const n=l.filter(g=>sel.has(g.id)).length,np=l.filter(g=>sel.has(g.id)&&g.ruolo==='P').length;
    return `<div class="card"><div class="row between"><h3 style="margin:0">${esc(sq)}</h3><span class="badge" style="color:${n===11&&np===1?'var(--green)':'var(--red)'}">${n}/11 · P ${np}/1</span></div>
    ${l.map(g=>`<div style="padding:4px 0"><label style="color:var(--txt)"><input type="checkbox" ${sel.has(g.id)?'checked':''} onchange="probTog(${g.id},this.checked)"> ${ruolo(g.ruolo)}${esc(g.nome)}</label></div>`).join('')}</div>`};
  app.innerHTML=`<button onclick="prb=null;pAdmin()">← Partite della giornata</button><h2 style="margin-top:12px">📋 Probabili: ${esc(p.casa)} – ${esc(p.trasferta)}</h2>
  <p class="muted">${proposta?'💡 Proposta automatica in base ai minuti delle ultime giornate: correggi e salva.':'Spunta gli 11 titolari probabili di ogni squadra (1 portiere).'} Le vedono anche gli utenti nella pagina della partita.</p>
  ${blocco(p.casa)}${blocco(p.trasferta)}
  <button class="pri" style="width:100%;margin-bottom:20px" onclick="probSalva()">💾 Salva probabili formazioni</button>`;
}
function probTog(id,v){v?prb.sel.add(id):prb.sel.delete(id);probRender()}
async function probImporta(gn){const righe=val('pb_txt').split('\n').map(x=>x.trim()).filter(Boolean);if(!righe.length)return toast('Incolla le righe',true);
  const box=document.getElementById('pb_ris');box.innerHTML='<p class="muted">Carico…</p>';
  const pp=chk(await db.from('partite_sa').select('api_id,casa,trasferta').eq('giornata',gn));const rep=[];
  const parole=t=>norm(t).replace(/[.,()'\-]/g,' ').split(/\s+/).filter(Boolean);
  for(const r of righe){const i=r.indexOf(':');if(i<0){rep.push('❌ '+r+' → manca "Squadra:"');continue}
    const sqN=r.slice(0,i).trim(),nomi=r.slice(i+1).split(/[;,]/).map(x=>x.trim()).filter(Boolean);
    const p=pp.find(x=>norm(x.casa)===norm(sqN)||norm(x.trasferta)===norm(sqN));if(!p){rep.push(`❌ ${sqN}: non gioca nella giornata ${gn}`);continue}
    const sq=norm(p.casa)===norm(sqN)?p.casa:p.trasferta;
    const rosa=chk(await db.from('giocatori').select('id,nome,ruolo').eq('squadra',sq).eq('attivo',true));const ok=[],no=[];
    for(const n of nomi){const pw=parole(n),lw=pw.filter(w=>w.length>2);
      const c=rosa.map(g=>{const nw=parole(g.nome);let sc=nw.join(' ')===pw.join(' ')?100:0;if(!sc&&lw.some(w=>nw.includes(w)))sc=pw.reduce((a,w)=>a+(nw.includes(w)?3:nw.some(x=>x[0]===w[0])?1:0),0);return {g,sc}}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
      if(!c.length||(c[1]&&c[1].sc===c[0].sc)){no.push(n);continue}ok.push(c[0].g)}
    const ids=rosa.map(g=>g.id);
    chk(await db.from('probabili').delete().eq('partita_id',p.api_id).in('giocatore_id',ids));
    if(ok.length)chk(await db.from('probabili').insert(ok.map(g=>({partita_id:p.api_id,giocatore_id:g.id}))));
    const np=ok.filter(g=>g.ruolo==='P').length;
    rep.push(`${ok.length===11&&np===1?'✅':'⚠️'} ${sq}: ${ok.length}/11 · P ${np}${no.length?' · non trovati: '+no.join(', '):''}`)}
  box.innerHTML=rep.map(esc).join('<br>')}
async function probSalva(){
  const id=prb.p.api_id;
  chk(await db.from('probabili').delete().eq('partita_id',id));
  if(prb.sel.size) chk(await db.from('probabili').insert([...prb.sel].map(g=>({partita_id:id,giocatore_id:g}))));
  toast('Probabili formazioni salvate');prb=null;pAdmin();
}

async function liveToggle(id,v){chk(await db.from('partite_sa').update({live:v}).eq('api_id',id));toast(v?'Live avviato':'Live chiuso');liveAdmin(id)}
async function liveEv(id,gid,k,_){const {data:e}=await db.from('live_eventi').select('*').eq('partita_id',id).eq('giocatore_id',gid).maybeSingle();
  if(k==='reset'){chk(await db.from('live_eventi').delete().eq('partita_id',id).eq('giocatore_id',gid));return liveAdmin(id)}

  chk(await db.from('live_eventi').upsert(o,{onConflict:'partita_id,giocatore_id'}));
  if(k==='gol'||k==='ag'){const {p,gg,ev}=await liveDati(id);const sq=g=>gg.find(x=>x.id===g)?.squadra;let gc=0,gt=0;ev.forEach(x=>{if(sq(x.giocatore_id)===p.casa){gc+=x.gol||0;gt+=x.ag||0}else{gt+=x.gol||0;gc+=x.ag||0}});await db.from('partite_sa').update({gol_casa:gc,gol_trasferta:gt}).eq('api_id',id)}

  const ids=[...new Set(pr.map(x=>x.giocatore_id))];

  const mie=new Set(chk(await db.from('rose').select('giocatore_id').eq('utente_id',utente.id)).map(x=>x.giocatore_id));
  const lista=(pid,sq)=>{const l=gg.filter(x=>x.squadra===sq&&pr.some(y=>y.partita_id===pid&&y.giocatore_id===x.id)).sort((a,b)=>ORD[a.ruolo]-ORD[b.ruolo]);

async function pSerieA(){
  const fg=chk(await db.from('fanta_giornate').select('numero,scadenza').order('numero'));
  if(!fg.length){app.innerHTML='<h2>Serie A</h2><p class="muted">Calendario non ancora caricato.</p>';return}

  const pp=chk(await db.from('partite_sa').select('*').eq('giornata',sa.g).order('data'));
  app.innerHTML=`<h2>Serie A</h2><select onchange="sa.g=this.value;pSerieA()">${fg.map(g=>`<option value="${g.numero}" ${g.numero==sa.g?'selected':''}>Giornata ${g.numero}</option>`).join('')}</select>

}

  }

  if(ad.tab==='giocatori'){
    h+=`<div class="card" style="border-color:var(--green)"><h3>📊 Quotazioni FantaTaccuino</h3><p class="muted" style="font-size:13px">Le quotazioni sono <b>nostre</b>: le calcola il sito dai voti della stagione (fantamedia, presenze e ruolo) e dopo ogni giornata si aggiornano da sole, al massimo di 3 punti in su o in giù. Non vengono prese da nessun altro sito.</p>
      <button onclick="quotRicalcola()">🔄 Ricalcola tutte da zero</button> <small class="muted">(azzera anche le frecce ▲▼)</small></div>
    <div class="card" style="border-color:#8e44ad"><h3>🧩 Ruoli "A ruoli"</h3><p class="muted" style="font-size:13px">I ruoli dettagliati (Por, Dc, B, Dd, Ds, E, M, C, T, W, A, Pc) li assegna il sito da solo, guardando <b>dove ha giocato davvero</b> ogni giocatore nelle formazioni ufficiali delle partite. Si aggiornano ogni notte. Se uno è sbagliato correggilo qui: da quel momento resta come l'hai messo tu.</p>
      <button onclick="ruoliAuto()">🔄 Aggiorna adesso</button>
      <input id="ru_q" placeholder="🔎 Cerca giocatore da correggere…" oninput="ruoliCerca()" style="margin-top:10px"><div id="ru_l"></div></div>`;
    h+=`<div class="card" style="border-color:var(--gold)"><h3>📋 Importa listone da testo</h3>
      <p class="muted">Una riga per giocatore: <b>Nome;Ruolo;Squadra;Quotazione</b> (ruolo P, D, C o A)<br>Es: <i>Federico Dimarco;D;Inter;16</i><br>Se il giocatore esiste già (stesso nome e squadra) aggiorna ruolo e quotazione, altrimenti lo crea.</p>
      <label class="pri" style="display:inline-block;padding:10px 14px;border-radius:14px;margin:0 0 8px;cursor:pointer">📂 Carica file .txt<input type="file" accept=".txt,text/plain" style="display:none" onchange="leggiTxt(this,'lst_txt')"></label>
      <textarea id="lst_txt" rows="7"></textarea>
      <label style="color:var(--txt);display:block;margin:8px 0"><input type="checkbox" id="lst_nuova"> Nuova stagione: prima metti fuori listone tutti i giocatori attuali (restano nello storico)</label>
      <button class="pri" onclick="impListTesto()">Importa listone</button><p id="lst_msg" class="muted"></p></div>
    <div class="card"><h3>Cerca e modifica</h3><input id="adg_q" placeholder="Nome giocatore" oninput="adCercaG()"><div id="adg_r"></div></div>
    <div class="card"><h3>Aggiungi a mano</h3><label>Nome</label><input id="ng_n"><label>Ruolo</label><select id="ng_r"><option>P</option><option>D</option><option>C</option><option>A</option></select>
      <label>Squadra</label><input id="ng_s"><label>Quotazione</label><input id="ng_q" type="number" value="1"><button class="pri" onclick="nuovoG()">Aggiungi</button></div>`;
  }

  if(ad.tab==='articoli'){h+=`<div class="card" style="text-align:center">${testata(26)}<p class="muted">Gli articoli ora si scrivono, si approvano e si gestiscono nella redazione de Il Taccuino.</p><button class="pri" onclick="GZ.ed=null;vai('scrivi')">✍️ Apri la redazione</button></div>`}
  app.innerHTML=h;
}
async function salvaRake(){const v=Math.max(0,Math.min(50,+val('rk')||0));chk(await db.from('impostazioni').upsert({chiave:'rake_calcetto',valore:String(v)}));await caricaFeat();toast('Trattenuta: '+v+'%')}
async function salvaWa(){const v=val('wa_num').replace(/[^0-9]/g,'');if(v&&v.length<10)return toast('Numero troppo corto: metti il prefisso 39 davanti',true);chk(await db.from('impostazioni').upsert({chiave:'wa_premium',valore:v}));await caricaFeat();toast(v?'Numero WhatsApp salvato':'Numero tolto');pAdmin()}
async function salvaDon(){const v=val('lk_don');if(v&&!/^https:\/\//.test(v))return toast('Il link deve iniziare con https://',true);chk(await db.from('impostazioni').upsert({chiave:'link_donazioni',valore:v}));await caricaFeat();renderNav();toast('Link salvato')}
async function setPremium(id,anni){const d=new Date();d.setFullYear(d.getFullYear()+anni);const upd={premium_fino:anni?d.toISOString().slice(0,10):null};
  chk(await db.from('profili').update(upd).eq('id',id));toast(anni?'Premium attivato per 1 anno':'Premium tolto');pAdmin()}
async function modGettoni(id,seg){const n=Math.abs(parseInt(document.getElementById('pg_'+id).value));if(!n)return toast('Scrivi quanti palloni dorati',true);
  const w=document.getElementById('pw_'+id).value,lab=w==='prova'?'palloni gratis':w==='palloni_vinti'?'palloni vinti':'palloni Premium';
  const u=chk(await db.from('profili').select('gettoni,prova,palloni_vinti,username').eq('id',id).single());const nuovo=Math.max(0,(u[w]||0)+seg*n);
  if(!confirm(`${seg>0?'Aggiungere':'Togliere'} ${n} ${lab} a ${u.username}? Saldo: ${u[w]||0} → ${nuovo}`))return;
  chk(await db.from('profili').update({[w]:nuovo}).eq('id',id));toast(`${u.username}: ${nuovo} ${lab}`);pAdmin()}
async function regalaGettoni(id,n){const u=chk(await db.from('profili').select('gettoni').eq('id',id).single());chk(await db.from('profili').update({gettoni:u.gettoni+n}).eq('id',id));toast('+'+n+' palloni dorati');pAdmin()}
async function toggleFeat(k,v){chk(await db.from('impostazioni').upsert({chiave:k,valore:v?'1':'0'}));await caricaFeat();toast(v?'Funzione attivata':'Funzione spenta');pAdmin()}
async function approva(id){chk(await db.from('profili').update({approvato:true}).eq('id',id));toast('Utente accettato');pAdmin()}
async function cambiaRuolo(id,r){chk(await db.from('profili').update({ruolo:r}).eq('id',id));pAdmin()}
async function rifiuta(id){if(!confirm('Sicuro? L\'utente non potrà più entrare.'))return;chk(await db.from('profili').delete().eq('id',id));pAdmin()}
async function delRiga(t,id){if(!confirm('Eliminare?'))return;chk(await db.from(t).delete().eq('id',id));toast('Eliminato');pAdmin()}
async function salvaScad(n){chk(await db.from('fanta_giornate').update({scadenza:new Date(val('sc_g')).toISOString()}).eq('numero',n));toast('Scadenza salvata')}
async function pubblica(n,stato){
  if(!confirm(stato?'Pubblicare i voti? Diventano visibili, contano per le classifiche e aggiornano le quotazioni (solo la prima volta).':'Ritirare i voti? Torneranno in bozza.'))return;
  chk(await db.from('fanta_giornate').update({pubblicata:stato}).eq('numero',n));toast(stato?'Voti pubblicati':'Voti ritirati');pAdmin();
}
async function salvaCorrezioni(){
  const rows=[...document.querySelectorAll('tr.mod')];
  if(!rows.length) return toast('Nessuna modifica',true);
  for(const tr of rows){
    const get=k=>tr.querySelector(`[data-k="${k}"]`);
    const v=get('voto').value;
    const upd={voto:v===''?null:+v,corretto:true,ammonizione:get('ammonizione').checked,espulsione:get('espulsione').checked};
    ['gol','assist','gol_subiti','rigori_parati','rigori_sbagliati','autogol'].forEach(k=>upd[k]=+get(k).value||0);
    chk(await db.from('voti').update(upd).eq('giornata',ad.g).eq('giocatore_id',+tr.dataset.g));
  }
  toast(rows.length+' voti corretti');pAdmin();
}
async function ripristina(gid){
  const v=chk(await db.from('voti').select('voto_auto').eq('giornata',ad.g).eq('giocatore_id',gid).single());
  chk(await db.from('voti').update({voto:v.voto_auto,corretto:false}).eq('giornata',ad.g).eq('giocatore_id',gid));
  toast('Voto automatico ripristinato (ricalcola la partita per i bonus)');pAdmin();
}
let tAd;
function adCercaG(){clearTimeout(tAd);tAd=setTimeout(async()=>{
  const q=val('adg_q');const b=document.getElementById('adg_r');if(q.length<2){b.innerHTML='';return}
  const gg=chk(await db.from('giocatori').select('*').ilike('nome','%'+q+'%').limit(20));
  b.innerHTML=gg.map(g=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div>${foto(g.foto)}${ruolo(g.ruolo)}<b>${esc(g.nome)}</b> <span class="muted">${esc(g.squadra)}</span></div>
    <div class="row" style="margin-top:6px"><span class="muted">Quotazione</span><input class="n" type="number" min="1" id="q_${g.id}" value="${g.quotazione}">
    <select id="r_${g.id}" style="width:60px;margin:0">${['P','D','C','A'].map(r=>`<option ${r===g.ruolo?'selected':''}>${r}</option>`).join('')}</select>
    <button class="ok" onclick="salvaG(${g.id})">Salva</button><button class="del" onclick="delRiga('giocatori',${g.id})">Elimina</button></div></div>`).join('')||'<p class="muted">Nessuno.</p>';
},300)}
function dataIt(d,o){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(d.trim());const h=/^(\d{1,2})[:.](\d{2})$/.exec((o||'').trim());if(!m||!h)return null;return new Date(+m[3],+m[2]-1,+m[1],+h[1],+h[2]).toISOString()}
async function impCalTesto(){
  const righe=val('cal_txt').split('\n').map(r=>r.trim()).filter(Boolean),ok=[],err=[];
  righe.forEach((r,i)=>{const [g,d,o,c,t]=r.split(';').map(x=>(x||'').trim());const data=dataIt(d,o);
    if(!+g||!data||!c||!t) err.push(i+1); else ok.push({giornata:+g,data,casa:c,trasferta:t})});
  if(err.length) return toast('Righe non valide: '+err.join(', '),true);
  if(!ok.length) return;
  const gs=[...new Set(ok.map(x=>x.giornata))];
  const es=chk(await db.from('partite_sa').select('api_id,giornata,casa,trasferta').in('giornata',gs));
  const mx=chk(await db.from('partite_sa').select('api_id').order('api_id',{ascending:false}).limit(1));
  let id=Math.max(1000000000,(mx[0]?.api_id||0)+1),nuove=[],agg=0;
  for(const p of ok){const e=es.find(x=>x.giornata===p.giornata&&x.casa===p.casa&&x.trasferta===p.trasferta);
    if(e){chk(await db.from('partite_sa').update({data:p.data}).eq('api_id',e.api_id));agg++}
    else nuove.push({api_id:id++,...p,stato:'NS'})}
  if(nuove.length) chk(await db.from('partite_sa').insert(nuove));
  for(const g of gs){const min=ok.filter(x=>x.giornata===g).map(x=>x.data).sort()[0];
    chk(await db.from('fanta_giornate').upsert({numero:g,scadenza:min},{onConflict:'numero'}))}
  toast(`${nuove.length} partite nuove, ${agg} aggiornate`);pAdmin();
}
async function impListTesto(){
  const righe=val('lst_txt').split('\n').map(r=>r.trim()).filter(Boolean),ok=[],err=[];
  righe.forEach((r,i)=>{const [n,ru,sq,q]=r.split(';').map(x=>(x||'').trim());const R=(ru||'').toUpperCase();
    if(!n||!['P','D','C','A'].includes(R)||!sq) err.push(i+1); else ok.push({nome:n,ruolo:R,squadra:sq,quotazione:Math.max(1,+q||1)})});
  if(err.length) return toast('Righe non valide: '+err.join(', '),true);
  if(!ok.length) return;
  const msg=document.getElementById('lst_msg');msg.textContent='Importo…';
  if(document.getElementById('lst_nuova').checked){if(!confirm('Mettere fuori listone tutti i giocatori attuali prima di importare?'))return;chk(await db.from('giocatori').update({attivo:false}).eq('attivo',true))}
  const sq=[...new Set(ok.map(x=>x.squadra))];
  const es=chk(await db.from('giocatori').select('id,nome,squadra').in('squadra',sq));
  const k=g=>norm(g.nome)+'|'+g.squadra;const mp={};es.forEach(g=>mp[k(g)]=g.id);
  const nuovi=[];let agg=0;
  for(const g of ok){const id=mp[k(g)];
    if(id){chk(await db.from('giocatori').update({ruolo:g.ruolo,quotazione:g.quotazione,attivo:true}).eq('id',id));agg++}
    else nuovi.push({...g,attivo:true})}
  for(let i=0;i<nuovi.length;i+=200) chk(await db.from('giocatori').insert(nuovi.slice(i,i+200)));
  const cal=chk(await db.from('partite_sa').select('casa,trasferta'));const squadreCal=new Set(cal.flatMap(p=>[p.casa,p.trasferta]));
  const fuori=sq.filter(x=>!squadreCal.has(x));
  msg.innerHTML=`✅ ${nuovi.length} nuovi, ${agg} aggiornati.`+(fuori.length?`<br><span style="color:var(--red)">⚠️ Squadre che non compaiono nel calendario: ${fuori.map(esc).join(', ')}. Controlla che i nomi siano scritti uguali.</span>`:'');
  toast('Listone importato');
}
async function salvaG(id){chk(await db.from('giocatori').update({quotazione:+document.getElementById('q_'+id).value||1,ruolo:document.getElementById('r_'+id).value}).eq('id',id));toast('Giocatore aggiornato')}
async function nuovoG(){
  const n=val('ng_n'),s=val('ng_s');if(!n||!s)return toast('Nome e squadra obbligatori',true);
  chk(await db.from('giocatori').insert({nome:n,ruolo:val('ng_r'),squadra:s,quotazione:+val('ng_q')||1}));toast('Giocatore aggiunto');pAdmin();
}
async function nuovoArt(){
  const t=val('ar_t'),x=val('ar_x');if(!t||!x)return toast('Titolo e testo obbligatori',true);
  chk(await db.from('articoli').insert({titolo:t,testo:x,immagine_url:val('ar_i')||null,premium:!!document.getElementById('ar_p')?.checked}));toast('Articolo pubblicato');pAdmin();
}
</script>
