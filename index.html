<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-title" content="FantaTaccuino">
<meta name="theme-color" content="#1d0f63">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#160b4f;--card:#2a1490;--card2:#3a1fb0;--line:#4f2fd6;--txt:#ffffff;--muted:#c9c3ee;--acc:#8b3dff;--acc2:#3a1fb0;--gold:#ffd447;--green:#5dff7a;--red:#ff6b6b;--cond:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif}
*{box-sizing:border-box}
html{background:#120a45}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(120% 60% at 80% 0%,#3a1c9c 0%,#1d0f63 45%,#120a45 100%) fixed;color:var(--txt);padding-bottom:110px;-webkit-font-smoothing:antialiased}
a{color:var(--gold)}
header{position:sticky;top:0;z-index:10;background:linear-gradient(#1d0f63ee,#1d0f6300);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:820px;margin:0 auto}
.brand h1{margin:0;font:800 25px var(--cond);letter-spacing:.2px}
.brand h1 span{color:var(--green)}
.brand button{padding:6px 14px;font-size:13px}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:2px;overflow-x:auto;background:#0d0826ee;border:1px solid #ffffff22;border-radius:40px;padding:7px;box-shadow:0 8px 24px #0009;scrollbar-width:none;max-width:800px;margin:0 auto}
nav::-webkit-scrollbar{display:none}
nav:empty{display:none}
nav button{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;border:0;border-radius:26px;padding:6px 4px;font-size:11px;font-weight:700;color:#c9c3ee;box-shadow:none}
nav button .ic{font-size:21px;line-height:1.15}
nav button.on{background:#ffffff16;color:var(--green)}
main{max-width:820px;margin:0 auto;padding:6px 14px 14px}
h2{margin:8px 2px 14px;font:800 30px var(--cond);letter-spacing:.2px}
h3{margin:2px 0 10px;font:800 21px var(--cond);letter-spacing:.2px}
.card{background:linear-gradient(160deg,#3d1fb8,#24107e);border:2px solid #4f2fd6;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px #0005,inset 0 1px 0 #ffffff22}
.card img{width:100%;border-radius:14px;margin-bottom:8px}
button{background:linear-gradient(#4b25c9,#3416a8);color:#fff;border:2px solid #6a45ef;border-radius:14px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #1d0b6b}
button:disabled{opacity:.5}
button.on{background:linear-gradient(#8b3dff,#5a12d6);border-color:#a46bff}
button.pri,button.ok{background:linear-gradient(#4ee36a,#1fb046);border:2px solid #7dff95;color:#fff;text-shadow:0 1px 0 #0b5a20;box-shadow:0 0 14px #3dff6a55,0 3px 0 #0d6b27;font:800 16px var(--cond);letter-spacing:.4px;text-transform:uppercase}
button.del{background:transparent;border-color:var(--red);color:var(--red);box-shadow:none}
input,select,textarea{background:#1a0d5a;color:#fff;border:2px solid #4f2fd6;border-radius:14px;padding:11px 12px;font-size:16px;width:100%;margin:4px 0 12px;font-family:inherit}
input::placeholder,textarea::placeholder{color:#9d95d6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
input[type=checkbox]{width:22px;height:22px;padding:0;margin:0 8px 0 0;vertical-align:middle;border-radius:6px;accent-color:var(--green)}
input.n{width:58px;text-align:center;margin:0}
label{font-size:13px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;background:#0d0826aa;padding:5px;border-radius:18px;border:1px solid #ffffff1a;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:transparent;border:0;box-shadow:none;color:var(--muted);border-radius:13px;padding:8px 12px}
.tabs button.on{background:linear-gradient(#8b3dff,#5a12d6);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid #ffffff1f;text-align:left}
th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.ris{font:800 26px var(--cond);color:var(--green)}
.pt{display:inline-block;padding:2px 9px;border-radius:10px;background:#ffffff18;font-weight:800}
.pt3{background:var(--green);color:#063}.pt1{background:var(--gold);color:#4a2c00}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#ffffff1c;color:#fff}
.ruolo{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-weight:800;font-size:12px;color:#fff;margin-right:8px;vertical-align:middle;border:2px solid #ffffff55}
.rP{background:#f59e0b}.rD{background:#22a35a}.rC{background:#2f6fed}.rA{background:#e5484d}
#chatbox{height:58vh;overflow-y:auto;background:#0d0826aa;border:1px solid #ffffff1a;border-radius:22px;padding:12px;margin-bottom:10px}
.scheda{display:flex;gap:16px;align-items:center}.scheda img{width:84px;height:84px;border-radius:50%;object-fit:cover}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat div{background:#ffffff12;border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--muted)}.stat b{display:block;font:800 24px var(--cond);color:#fff}
.msg{margin-bottom:10px;background:#ffffff10;border-radius:16px;padding:8px 12px}.msg b{color:var(--gold)}.msg small{color:var(--muted);margin-left:6px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:linear-gradient(#4ee36a,#1fb046);color:#fff;padding:11px 18px;border-radius:16px;font-weight:800;display:none;z-index:99;max-width:90%;box-shadow:0 8px 24px #0008}
#toast.err{background:var(--red)}
.auth{max-width:400px;margin:48px auto}
.logo{text-align:center;font-size:52px;margin-bottom:4px}
details summary{cursor:pointer;color:var(--muted);margin-top:8px}
tr.mod td{background:#ffd44722}
/* carte giocatore */
.fcard{--w:112px;position:relative;width:var(--w);height:calc(var(--w)*1.4);font-size:calc(var(--w)/10);flex:0 0 auto;cursor:pointer;filter:drop-shadow(0 6px 8px #0009);clip-path:polygon(0 6%,6% 0,94% 0,100% 6%,100% 82%,50% 100%,0 82%);border-radius:10px;color:#3a2600}
.fcard.t-oro{background:linear-gradient(135deg,#fff1b0,#e8b923 50%,#8a5e00)}
.fcard.t-argento{background:linear-gradient(135deg,#fff,#c9d1dc 50%,#6f7a88);color:#1d2633}
.fcard.t-bronzo{background:linear-gradient(135deg,#ffd9b5,#c98a4b 50%,#6b3d14);color:#2e1606}
.fcard.t-viola{background:linear-gradient(135deg,#e9d6ff,#9b5cff 50%,#3d1491);color:#fff}
.fcard .fv{position:absolute;left:7%;top:5%;font:900 2.1em/1 var(--cond)}
.fcard .fr{position:absolute;left:9%;top:24%;font-weight:900;font-size:1.15em}
.fcard .fforma{position:absolute;right:6%;top:6%;width:52%;height:40%;background:#00000018;border-radius:.8em;display:flex;align-items:flex-end;justify-content:space-around;padding:.3em .3em 1.1em}
.fcard .fforma span{position:absolute;left:0;right:0;bottom:.2em;text-align:center;font-size:.62em;font-weight:800;opacity:.75;text-transform:uppercase}
.fcard .fb{width:.85em;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.fcard .fb i{display:block;width:100%;border-radius:.25em}
.fcard .fb small{font-size:.6em;font-weight:800;line-height:1.2}
.fcard .fnone{font-size:.7em;font-weight:700;opacity:.7;align-self:center;text-align:center}
.fcard .fn{position:absolute;left:6%;right:6%;top:52%;text-align:center;font:900 1.12em/1.3 var(--cond);letter-spacing:-.2px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid #0000002a;padding-top:.25em}
.fcard .fs{position:absolute;left:4%;right:4%;top:66%;text-align:center;font-weight:700;font-size:.85em;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;justify-items:center}
/* campo */
.campo{position:relative;border-radius:24px;background:repeating-linear-gradient(180deg,#3b1fa8 0 60px,#3417a0 60px 120px);border:2px solid #ffffff22;overflow:hidden;padding:26px 8px;display:flex;flex-direction:column;gap:30px}
.campo:before{content:"";position:absolute;inset:10px;border:2px solid #ffffff40;border-radius:8px;pointer-events:none}
.campo:after{content:"";position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px;border:2px solid #ffffff40;border-radius:50%;pointer-events:none}
.campo .linea{display:flex;justify-content:space-evenly;position:relative;z-index:1}
.panca{display:flex;gap:8px;overflow-x:auto;padding:8px 2px}
.chip{display:inline-flex;align-items:center;background:#0d0826d9;border:1px solid #ffffff33;border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;white-space:nowrap;box-shadow:0 3px 8px #0007}.chip .ruolo{margin-right:6px}
.campo .linea{flex-wrap:wrap;gap:6px}
/* home */
.hero{border-radius:24px;padding:16px;background:linear-gradient(120deg,#2b1675,#1a0d52);border:1px solid #ffffff1a;display:flex;align-items:center;gap:12px;margin-bottom:18px}
.hero .t{flex:1;font:800 25px/1.05 var(--cond)}
.news{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.news::-webkit-scrollbar{display:none}
.news div{flex:0 0 150px;height:180px;border-radius:20px;border:2px solid #ffffff30;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:10px;font:800 17px/1.1 var(--cond);cursor:pointer;box-shadow:0 6px 16px #0006}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.tile{background:linear-gradient(160deg,#4b25c9,#2a1490);border:2px solid #5a35e0;border-radius:20px;box-shadow:0 6px 18px #0006,inset 0 1px 0 #ffffff30;text-align:center;padding:10px 4px;cursor:pointer}

document.querySelector('.brand h1 img').src=LOGO;
const app = document.getElementById('app');
let utente = null, profilo = null, pagina = 'home', chatCanale = null, FEAT = {};
async function caricaFeat(){const r=(await db.from('impostazioni').select('*')).data||[];FEAT={};r.forEach(x=>FEAT[x.chiave]=x.valore)}
const on=k=>FEAT[k]!=='0';

// ---------- utilità ----------
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m,err){const t=document.getElementById('toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3000)}
function chk(r){if(r.error){toast(r.error.message,true);throw r.error}return r.data}
function fmt(iso){return new Date(iso).toLocaleString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function val(id){return document.getElementById(id).value.trim()}
const ORD = {P:0,D:1,C:2,A:3};
function ruolo(r){return `<span class="ruolo r${r}">${r}</span>`}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toLocal(iso){const d=new Date(iso);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function foto(u){return u?`<img src="${esc(u)}" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;background:#fff">`:''}

// ---------- accesso ----------
db.auth.onAuthStateChange((ev,session)=>{
  if(ev==='TOKEN_REFRESHED') return;
  if(session && utente && session.user.id===utente.id && profilo) return;
  setTimeout(()=>avvia(session),0);
});

async function avvia(session){
  utente = session?.user || null;
  if(!utente){profilo=null;document.getElementById('top').style.display='none';renderAuth();return}
  const {data} = await db.from('profili').select('*').eq('id',utente.id).maybeSingle();
  profilo = data;
  if(!profilo) return schermata('Account non attivo','Il tuo account non è stato accettato.');
  if(!profilo.approvato) return schermata('In attesa di approvazione','La tua registrazione è arrivata. Un admin deve accettarla prima che tu possa entrare: riprova più tardi.');
  await caricaFeat();
  document.getElementById('top').style.display='block';
  renderNav(); vai(pagina);
}

function schermata(t,m){
  document.getElementById('nav').innerHTML='';
  document.getElementById('top').style.display='none';
  app.innerHTML=`<div class="auth card"><div class="logo"><img src="${LOGO}" alt="" style="width:72px;height:72px;border-radius:18px"></div><h2 style="text-align:center">${t}</h2><p class="muted">${m}</p>
  <div class="row"><button onclick="location.reload()">Riprova</button><button onclick="esci()">Esci</button></div></div>`;
}

let modoAuth='login';
function renderAuth(){
  document.getElementById('nav').innerHTML='';
  app.innerHTML=`<div class="auth"><div class="logo"><img src="${LOGO}" alt="FantaTaccuino" style="width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px #0008"></div><h2 style="text-align:center">FantaTaccuino</h2>
  <div class="card"><div class="tabs">
    <button class="${modoAuth==='login'?'on':''}" onclick="modoAuth='login';renderAuth()">Accedi</button>
    <button class="${modoAuth==='reg'?'on':''}" onclick="modoAuth='reg';renderAuth()">Registrati</button></div>
    ${modoAuth==='reg'?'<label>Nome utente</label><input id="a_user" maxlength="20">':''}
    <label>Email</label><input id="a_mail" type="email">
    <label>Password (almeno 6 caratteri)</label><input id="a_pass" type="password">
    ${modoAuth==='reg'?'<label style="display:flex;gap:8px;align-items:flex-start;color:var(--txt);margin:10px 0"><input type="checkbox" id="a_ok" style="width:auto;margin-top:3px"><span>Ho almeno 14 anni e ho letto e accetto <a href="#" onclick="mostraTermini();return false">termini d\'uso e privacy</a></span></label>':''}
    <button class="pri" style="width:100%" onclick="${modoAuth==='login'?'accedi()':'registrati()'}">${modoAuth==='login'?'Entra':'Crea account'}</button>
  </div><p style="text-align:center"><a href="#" onclick="mostraTermini();return false">📜 Termini d'uso e privacy</a></p></div>`;
}
async function accedi(){
  const {error}=await db.auth.signInWithPassword({email:val('a_mail'),password:val('a_pass')});
  if(error) toast('Email o password errati',true);
}
async function registrati(){
  const username=val('a_user');
  if(username.length<3) return toast('Nome utente di almeno 3 caratteri',true);
  if(!document.getElementById('a_ok').checked) return toast('Devi accettare termini d\'uso e privacy',true);
  const {error}=await db.auth.signUp({email:val('a_mail'),password:val('a_pass'),options:{data:{username,termini:TERMINI_VER}}});
  if(error) return toast(error.message,true);
  toast('Registrazione completata! Se ti è arrivata una mail di conferma, aprila e poi accedi.');
}
async function esci(){await db.auth.signOut();utente=null;profilo=null;pagina='home';renderAuth()}

// ---------- navigazione ----------
const PAGINE = {home:'🏠 Home',fanta:'📋 Leghe',sng:'⚽ Calcetto',giocatori:'🔎 Giocatori',seriea:'📅 Serie A',chat:'💬 Chat',premium:'💎 Premium',termini:'📜 Termini',admin:'⚙️ Admin'};
function navB(v){const i=v.indexOf(' ');return `<span class="ic">${v.slice(0,i)}</span><span>${v.slice(i+1)}</span>`}
function renderNav(){
  document.getElementById('nav').innerHTML=Object.entries(PAGINE)
    .filter(([k])=>(k!=='admin'||profilo.ruolo==='admin')&&(k!=='sng'||on('f_sng'))&&(k!=='premium'||on('f_premium')))
    .map(([k,v])=>`<button class="${k===pagina?'on':''}" onclick="vai('${k}')">${navB(v)}</button>`).join('')
    +(FEAT.link_donazioni?`<button onclick="window.open('${esc(FEAT.link_donazioni)}','_blank')">${navB('☕ Sostienici')}</button>`:'');
}
function vai(p){
  pagina=p; renderNav(); if(typeof draftTimer!=='undefined') clearTimeout(draftTimer); if(typeof sngTimer!=='undefined') clearTimeout(sngTimer); if(typeof sngIv!=='undefined') clearInterval(sngIv);
  if(chatCanale){db.removeChannel(chatCanale);chatCanale=null}
  app.innerHTML='<p class="muted">Caricamento…</p>';
  ({home:pHome,fanta:pFanta,sng:pSng,giocatori:pGiocatori,seriea:pSerieA,chat:pChat,termini:pTermini,premium:pPremium,admin:pAdmin})[p]();
}

function golDa(pt,lega){return pt<lega.soglia_gol?0:Math.floor((pt-lega.soglia_gol)/lega.passo_gol)+1}
function golMatch(i,ris,lega){
  const A=ris[i.giornata]?.[i.casa]||{pt:0},B=ris[i.giornata]?.[i.trasferta]||{pt:0};
  let gc=golDa(A.pt,lega),gt=golDa(B.pt,lega);
  if(A.muro) gt=Math.max(0,gt-1);
  if(B.muro) gc=Math.max(0,gc-1);
  return [gc,gt,A.pt,B.pt];
}

async function datiLega(lega,membri){
  let pub=chk(await db.from('fanta_giornate').select('numero').eq('pubblicata',true).order('numero')).map(g=>g.numero);
  if(lega.giornata_da) pub=pub.filter(g=>g>=lega.giornata_da&&(!lega.giornata_a||g<=lega.giornata_a));
  const form=chk(await db.from('formazioni').select('utente_id,giornata,giocatore_id,titolare,ordine').eq('lega_id',lega.id));
  const carte=lega.carte?chk(await db.from('carte_usate').select('*').eq('lega_id',lega.id)):[];
  const gids=[...new Set([...form.map(f=>f.giocatore_id),...carte.filter(c=>c.giocatore_id).map(c=>c.giocatore_id)])];
  const voti=gids.length?chk(await db.from('voti').select('giocatore_id,giornata,fantavoto,voto').in('giocatore_id',gids)):[];
  const gioc=gids.length?chk(await db.from('giocatori').select('id,nome,ruolo').in('id',gids)):[];
  const vm={};voti.forEach(v=>vm[v.giocatore_id+'-'+v.giornata]=v);
  const gm={};gioc.forEach(g=>gm[g.id]=g);
  const cartaDi=(g,u,c)=>carte.find(x=>x.giornata===g&&x.utente_id===u&&x.carta===c);
  const ris={};
  for(const g of pub){
    ris[g]={};
    for(const m of membri){
      const uid=m.utente_id;
      const mie=form.filter(f=>f.utente_id===uid&&f.giornata===g);
      if(!mie.length){ris[g][uid]={pt:0,righe:[],extra:[],vuota:true,muro:!!cartaDi(g,uid,'muro')};continue}
      const maxCambi=cartaDi(g,uid,'panchina')?5:3;
      const tit=mie.filter(f=>f.titolare).sort((a,b)=>ORD[gm[a.giocatore_id]?.ruolo]-ORD[gm[b.giocatore_id]?.ruolo]);
      const pan=mie.filter(f=>!f.titolare).sort((a,b)=>a.ordine-b.ordine);
      const usati=new Set();let cambi=0,pt=0;const righe=[],extra=[],inCampo=new Set();
      for(const t of tit){
        const gi=gm[t.giocatore_id],v=vm[t.giocatore_id+'-'+g];
        if(v&&v.fantavoto!==null){pt+=Number(v.fantavoto);righe.push({g:gi,fv:Number(v.fantavoto)});inCampo.add(t.giocatore_id);continue}
        let entrato=null;
        if(cambi<maxCambi){
          for(const p of pan){
            if(usati.has(p.giocatore_id))continue;
            const gp=gm[p.giocatore_id],vp=vm[p.giocatore_id+'-'+g];
            if(gp?.ruolo===gi?.ruolo&&vp&&vp.fantavoto!==null){entrato={g:gp,fv:Number(vp.fantavoto)};usati.add(p.giocatore_id);inCampo.add(p.giocatore_id);cambi++;break}
          }
        }
        righe.push({g:gi,fv:null,sv:true});
        if(entrato){pt+=entrato.fv;righe.push({...entrato,entra:true})}
      }
      const cap=cartaDi(g,uid,'capitano');
      if(cap){const v=vm[cap.giocatore_id+'-'+g],n=gm[cap.giocatore_id]?.nome;
        if(v&&v.voto!==null&&inCampo.has(cap.giocatore_id)){const b=Math.round((Number(v.fantavoto)-Number(v.voto))*10)/10;pt+=b;extra.push(`👑 Capitano ${esc(n)}: ${b>=0?'+':''}${b}`)}
        else extra.push(`👑 Capitano ${esc(n)}: non ha giocato, nessun effetto`)}
      const sc=cartaDi(g,uid,'scommessa');
      if(sc){const v=vm[sc.giocatore_id+'-'+g],n=gm[sc.giocatore_id]?.nome;let b=0;
        if(v&&v.voto!==null){b=Number(v.voto)>=7?3:Number(v.voto)<6?-3:0}
        pt+=b;extra.push(`🎲 Scommessa su ${esc(n)} (voto ${v?.voto??'s.v.'}): ${b>0?'+':''}${b}`)}
      if(cartaDi(g,uid,'panchina')) extra.push('🔄 Panchina lunga: fino a 5 cambi');
      const muro=!!cartaDi(g,uid,'muro');if(muro) extra.push('🧱 Muro: annulla un gol avversario');
      ris[g][uid]={pt:Math.round(pt*10)/10,righe,extra,muro};
    }
  }
  return {pub,ris};
}

        ${cl.map((m,i)=>{const t=tot[m.utente_id];return `<tr><td>${i+1}</td><td><b>${esc(m.nome_squadra)}</b></td><td><b style="color:var(--gold)">${t.punti}</b></td><td>${t.g}</td><td>${t.v}</td><td>${t.n}</td><td>${t.p}</td><td>${t.gf}</td><td>${t.gs}</td><td>${t.pt.toFixed(1)}</td></tr>`}).join('')}</table>
        <p class="muted" style="font-size:12px">FP = fantapunti totali (primo criterio di spareggio). Gol: ${lega.soglia_gol} punti = 1 gol, poi +1 ogni ${lega.passo_gol}.</p></div>`;

        <p class="muted" style="font-size:12px">Contano solo le giornate con voti pubblicati${lega.giornata_da?` dalla ${lega.giornata_da} alla ${lega.giornata_a||38}`:''}. Sostituzioni automatiche: massimo 3, stesso ruolo, in ordine di panchina.</p></div>`;
    } else {

        const incG=inc.filter(i=>i.giornata===g);

  }

  if(fz.tab==='draft'){
    if(lega.draft_stato==='attesa') h+=`<div class="card"><p class="muted">Il draft non è ancora iniziato. ${pres?'Avvialo dalla scheda Gestione quando sono entrati tutti i partecipanti.':'Aspetta che il presidente lo avvii.'}</p></div>`;
    else{
      const ord=lega.draft_ordine||[],m=ord.length,n=rose.length,finito=lega.draft_stato==='finito';

  if(fz.tab==='rosa'){

    if(ombraMia) h+=`<div class="card"><h3>👥 Importa la tua rosa</h3><p class="muted">Copia la rosa dall'altra app (Fantagazzetta, Fantalab…) e incollala qui: un giocatore per riga. Basta il cognome, anche senza accenti (es. "Lautaro Martinez", "Martinez L.", "Dimarco").</p>

  if(fz.tab==='formazione'){
    const giorn=chk(await db.from('fanta_giornate').select('*').gt('scadenza',new Date().toISOString()).order('numero').limit(1));
    const mia=rose.filter(r=>r.utente_id===utente.id).sort((a,b)=>ORD[a.giocatori.ruolo]-ORD[b.giocatori.ruolo]||a.giocatori.nome.localeCompare(b.giocatori.nome));
    if(!giorn.length) h+='<p class="muted">Nessuna giornata aperta per la formazione.</p>';
    else if(!mia.length) h+='<p class="muted">La tua rosa è vuota.</p>';
    else{
      const g=giorn[0];
      const att=chk(await db.from('formazioni').select('giocatore_id,titolare,ordine').eq('lega_id',lega.id).eq('utente_id',utente.id).eq('giornata',g.numero));
      const sch=chk(await db.from('schieramenti').select('modulo').eq('lega_id',lega.id).eq('utente_id',utente.id).eq('giornata',g.numero).maybeSingle());

      const alr={};FVM=await votiDi(mia.map(r=>r.giocatore_id));FGM={};mia.forEach(r=>FGM[r.giocatore_id]={...r.giocatori,id:r.giocatore_id});
      if(premOk()){
        const pp=chk(await db.from('partite_sa').select('api_id,casa,trasferta').eq('giornata',g.numero));
        const ids=pp.map(p=>p.api_id);
        const pr=ids.length?chk(await db.from('probabili').select('partita_id,giocatore_id').in('partita_id',ids)):[];
        const conP=new Set(pr.map(x=>x.partita_id)),tit=new Set(pr.map(x=>x.giocatore_id));
        const vv=chk(await db.from('voti').select('giocatore_id,fantavoto').in('giocatore_id',mia.map(r=>r.giocatore_id)).not('fantavoto','is',null));
        const fm={};vv.forEach(v=>(fm[v.giocatore_id]=fm[v.giocatore_id]||[]).push(+v.fantavoto));
        const sc={};
        mia.forEach(r=>{const p=pp.find(x=>x.casa===r.giocatori.squadra||x.trasferta===r.giocatori.squadra);
          const st=!p?'out':!conP.has(p.api_id)?'?':tit.has(r.giocatore_id)?'ok':'no';const m=fm[r.giocatore_id];
          alr[r.giocatore_id]=st;sc[r.giocatore_id]=(st==='ok'?100:st==='?'?50:0)+(m?m.reduce((a,b)=>a+b,0)/m.length:6)});
        let best=null;
        for(const [nm,md] of Object.entries(MODULI)){const need={P:1,D:md[0],C:md[1],A:md[2]},ass={};let tot=0,ok=true;
          for(const R of ['P','D','C','A']){const l=mia.filter(r=>r.giocatori.ruolo===R).sort((a,b)=>sc[b.giocatore_id]-sc[a.giocatore_id]);
            if(l.length<need[R]){ok=false;break}l.slice(0,need[R]).forEach(r=>{ass[r.giocatore_id]='T';tot+=sc[r.giocatore_id]})}
          if(ok&&(!best||tot>best.tot))best={nm,ass,tot}}
        if(best){mia.filter(r=>!best.ass[r.giocatore_id]).sort((a,b)=>sc[b.giocatore_id]-sc[a.giocatore_id]).slice(0,nPan).forEach((r,i)=>best.ass[r.giocatore_id]='P'+(i+1));CONS={mod:best.nm,ass:best.ass}}else CONS=null;
        const nm=id=>esc(mia.find(r=>r.giocatore_id===id)?.giocatori.nome);
        const tz=att.filter(x=>x.titolare),bad=tz.filter(x=>['no','out'].includes(alr[x.giocatore_id]));
        const allarme=!pr.length?'<p class="muted">Le probabili formazioni di questa giornata non sono ancora uscite.</p>':!tz.length?'<p class="muted">Non hai ancora salvato la formazione.</p>':bad.length?bad.map(x=>`<p style="color:var(--red);margin:4px 0">⚠️ <b>${nm(x.giocatore_id)}</b> ${alr[x.giocatore_id]==='out'?'non gioca in questa giornata':'non è nelle probabili formazioni'}</p>`).join(''):'<p style="color:var(--green)">✅ Tutti i tuoi titolari sono nelle probabili formazioni.</p>';
        h+=`<div class="card" style="border-color:var(--gold)"><h3>💎 Allarme probabili</h3>${allarme}</div>
        <div class="card" style="border-color:var(--gold)"><h3>💎 Consiglio formazione</h3>${CONS?`<p class="muted">Modulo consigliato: <b>${CONS.mod}</b>. Prima i giocatori nelle probabili formazioni, poi quelli con la fantamedia più alta.</p>
          <button class="pri" onclick="applicaCons()">🪄 Applica il consiglio</button><p class="muted" style="font-size:12px">Il consiglio compila la formazione: controllala e poi tocca <b>Salva formazione</b>.</p>`:'<p class="muted">La tua rosa non ha abbastanza giocatori per un modulo completo.</p>'}</div>`;
      } else h+=`<div class="card" style="border-color:var(--gold)"><p class="muted">💎 Con il Premium: consiglio formazione e allarme se un tuo titolare non è nelle probabili.</p></div>`;
      const tag=id=>({ok:' <small style="color:var(--green)">✅ probabile</small>',no:' <small style="color:var(--red)">⚠️ non nelle probabili</small>',out:' <small style="color:var(--red)">⛔ non gioca</small>'})[alr[id]]||'';

      <p id="f_cnt" class="muted"></p><div id="f_campo"></div>
      <p class="muted" style="font-size:12px">Per ogni giocatore scegli <b>Titolare</b>, una posizione in <b>Panchina</b> (P1 entra per primo) o lascialo in tribuna.</p>
      ${mia.map(r=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${ruolo(r.giocatori.ruolo)}${esc(r.giocatori.nome)} <small class="muted">${esc(r.giocatori.squadra)}</small>${tag(r.giocatore_id)}</span><span style="margin-left:auto;margin-right:8px">${forma5(FVM[r.giocatore_id])}</span>
        <select class="fsel" data-g="${r.giocatore_id}" data-r="${r.giocatori.ruolo}" style="width:105px;margin:0" onchange="contaForm()">
        <option value="">Tribuna</option><option value="T" ${stato(r.giocatore_id)==='T'?'selected':''}>Titolare</option>
        ${Array.from({length:nPan},(_,i)=>`<option value="P${i+1}" ${stato(r.giocatore_id)==='P'+(i+1)?'selected':''}>Panchina ${i+1}</option>`).join('')}</select></div>`).join('')}
      <button class="pri" style="width:100%;margin-top:12px" onclick="salvaFormazione(${lega.id},${g.numero})">Salva formazione</button></div>`;
      if(lega.carte&&on('f_carte')){

        h+=`<div class="card"><h3>🃏 Carte Tattiche</h3><p class="muted">Ogni carta si gioca una sola volta in tutta la stagione. Puoi annullarla fino alla scadenza.</p>
        ${CARTE.map(c=>{const u=mie.find(x=>x.carta===c.k);

          return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${c.n}</b><br><small class="muted">${c.d}</small>
          ${c.gioc?`<select id="cg_${c.k}" style="margin:6px 0">${mia.map(r=>`<option value="${r.giocatore_id}">${r.giocatori.ruolo} · ${esc(r.giocatori.nome)}</option>`).join('')}</select>`:'<br>'}
          <button onclick="usaCarta(${lega.id},${g.numero},'${c.k}')">Gioca in questa giornata</button></div>`}).join('')}</div>`;
      }

  if(fz.tab==='gestione'&&pres){

    if(lega.modalita==='draft') h+=`<div class="card"><h3>Draft</h3>
      ${lega.draft_stato==='attesa'?`<p class="muted">Avvialo quando sono entrati tutti (${membri.length} squadre ora). L'ordine viene estratto a sorte.</p><button class="pri" onclick="avviaDraft(${lega.id})">Avvia draft</button>`
      :`<p class="muted">Stato: ${lega.draft_stato==='finito'?'concluso':'in corso'}.</p><button class="del" onclick="resetDraft(${lega.id})">Ricomincia draft da zero</button>`}</div>`;
    h+=`<div class="card"><h3>Calendario scontri diretti</h3>
      <p class="muted">${gi.length?`Calendario attivo dalla giornata ${gi[0]} alla ${gi[gi.length-1]} di Serie A.`:'Nessun calendario: la lega usa solo la classifica a punti totali.'}</p>

      <label>Giornata di Serie A finale</label><input id="cal_a" type="number" min="1" max="38" value="${gi[gi.length-1]||lega.giornata_a||38}">
      <button class="pri" onclick="generaCalendario(${lega.id})">${gi.length?'Rigenera calendario':'Genera calendario'}</button>
      ${gi.length?`<button class="del" onclick="cancellaCalendario(${lega.id})">Elimina calendario</button>`:''}
      <p class="muted" style="font-size:12px">Genera il calendario dopo che sono entrati tutti i partecipanti (${membri.length} ora). Con un numero dispari ogni giornata una squadra riposa.</p></div>
    <div class="card"><h3>Fasce gol</h3><label>Punti per il primo gol</label><input id="sg" type="number" step="0.5" value="${lega.soglia_gol}">

      <button class="pri" onclick="salvaFasce(${lega.id})">Salva</button></div>

      <label>Squadra</label><select id="g_mem">${membri.map(m=>`<option value="${m.utente_id}">${esc(m.nome_squadra)}</option>`).join('')}</select>
      <label>Cerca giocatore</label><input id="g_cerca" placeholder="Scrivi almeno 2 lettere" oninput="cercaGiocatori(${lega.id})">
      <label>Prezzo</label><input id="g_prezzo" type="number" value="1" min="0">
      <div id="g_ris"></div></div>
    <div class="card"><h3>Rose assegnate</h3>
      ${membri.map(m=>{const rr=rose.filter(r=>r.utente_id===m.utente_id).sort((a,b)=>ORD[a.giocatori.ruolo]-ORD[b.giocatori.ruolo]);
        return `<details><summary>${esc(m.nome_squadra)} (${rr.length})</summary>${rr.map(r=>`<div class="row between" style="padding:4px 0"><span>${ruolo(r.giocatori.ruolo)}${esc(r.giocatori.nome)} · ${r.prezzo}</span><button class="del" onclick="togliGiocatore(${r.id})">Togli</button></div>`).join('')}</details>`}).join('')}
    </div>
    <div class="card"><h3>Partecipanti</h3>${membri.map(m=>`<div class="row between" style="padding:4px 0"><span>${esc(m.nome_squadra)} <span class="muted">${un(m.profili)}</span></span>
      ${m.utente_id!==lega.creatore_id?`<button class="del" onclick="togliMembro(${lega.id},'${m.utente_id}')">Rimuovi</button>`:'<span class="badge">Presidente</span>'}</div>`).join('')}
      <button class="del" style="margin-top:14px" onclick="eliminaLega(${lega.id})">Elimina lega</button></div>`;
  }
  app.innerHTML=h;
  if(fz.tab==='formazione') contaForm();
}
let CONS=null,FVM={},FGM={};
function disegnaCampo(){const box=document.getElementById('f_campo');if(!box)return;
  const t={P:[],D:[],C:[],A:[]},pan=[];
  document.querySelectorAll('.fsel').forEach(s=>{const g=FGM[s.dataset.g];if(!g)return;if(s.value==='T')t[s.dataset.r].push(g);else if(s.value)pan.push([+s.value.slice(1),g])});
  const c=g=>`<div class="chip">${ruolo(g.ruolo)}<b>${esc(g.nome)}</b></div>`;
  if(!Object.values(t).some(x=>x.length)){box.innerHTML='';return}
  box.innerHTML=`<div class="campo">${['A','C','D','P'].map(R=>`<div class="linea">${t[R].map(c).join('')}</div>`).join('')}</div>
  ${pan.length?`<h3 style="margin-top:12px">🪑 Panchina</h3><div class="panca">${pan.sort((a,b)=>a[0]-b[0]).map(x=>`<div style="text-align:center;flex:0 0 auto"><small class="muted">P${x[0]}</small><br>${c(x[1])}</div>`).join('')}</div>`:''}`}
function applicaCons(){if(!CONS)return;document.getElementById('f_mod').value=CONS.mod;document.querySelectorAll('.fsel').forEach(s=>s.value=CONS.ass[s.dataset.g]||'');contaForm();toast('Consiglio applicato: ora tocca Salva formazione');document.getElementById('f_mod').scrollIntoView({behavior:'smooth'})}
function contaForm(){
  const el=document.getElementById('f_cnt');if(!el)return;

function roundRobin(ids){
  const t=[...ids];if(t.length%2)t.push(null);
  const n=t.length,giri=[];
  for(let r=0;r<n-1;r++){
    const m=[];
    for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)m.push(r%2?[b,a]:[a,b])}
    giri.push(m);t.splice(1,0,t.pop());
  }
  return giri;
}

async function importaOmbra(lid){

  const ok=[],dubbi=[],no=[];

    cand.forEach(g=>g._p=punti(g));cand.sort((a,b)=>b._p-a._p);

  if(r==='P'){const pz=Math.floor(n('goals','saves')/3)*0.5;if(pz)add(pz,`${n('goals','saves')} parate`);if(gc===0&&mins>=60)add(0.5,'porta inviolata');if(gc>=3)add(-0.5,'la squadra ha subito 3+ gol')}
  else if(r==='D'){if(gc===0&&mins>=60)add(0.5,'porta inviolata');const dif=n('tackles','total')+n('tackles','interceptions')+n('tackles','blocks');if(dif>=6)add(0.5,`${dif} azioni difensive`);const dt=n('duels','total');if(dt>=6&&n('duels','won')/dt>=0.6)add(0.5,`duelli vinti ${n('duels','won')}/${dt}`);if(n('dribbles','past')>=3)add(-0.5,`saltato ${n('dribbles','past')} volte`);if(gc>=3)add(-0.5,'la squadra ha subito 3+ gol');if(n('penalty','commited')>=1)add(-1,'rigore causato')}

  else{if(n('shots','on')>=3)add(0.5,`${n('shots','on')} tiri in porta`);if(n('passes','key')>=2)add(0.5,`${n('passes','key')} passaggi chiave`);if(n('dribbles','success')>=3)add(0.5,`${n('dribbles','success')} dribbling riusciti`);if(n('penalty','won')>=1)add(0.5,'rigore procurato');if(mins>=60&&n('shots','total')===0)add(-0.5,'nessun tiro in 60+ minuti')}
  const max=(gol||ass)?9:7.5;if(v>max)L.push(`Tetto massimo ${String(max).replace('.',',')}${max===7.5?' senza gol né assist':''}`);if(v<4)L.push('Voto minimo 4');
  return L;
}

async function schedaG(id){
  const g=chk(await db.from('giocatori').select('*').eq('id',id).single());
  const vv=chk(await db.from('voti').select('*').eq('giocatore_id',id).order('giornata'));
  const giocate=vv.filter(v=>v.voto!==null);
  const media=k=>giocate.length?(giocate.reduce((s,v)=>s+Number(v[k]),0)/giocate.length).toFixed(2):'-';
  const somma=k=>vv.reduce((s,v)=>s+Number(v[k]||0),0);
  let pp=[];
  if(on('f_voto_spiegato')&&premOk()&&vv.length){const q=JSON.stringify(g.squadra);pp=chk(await db.from('partite_sa').select('*').in('giornata',vv.map(v=>v.giornata)).or(`casa.eq.${q},trasferta.eq.${q}`))}
  const gcDi=gn=>{const p=pp.find(x=>x.giornata===gn);if(!p||p.gol_casa===null)return null;return p.casa===g.squadra?p.gol_trasferta:p.gol_casa};
  const avv=gn=>{const p=pp.find(x=>x.giornata===gn);return p?(p.casa===g.squadra?'vs '+p.trasferta:'@ '+p.casa):''};
  let graf='';
  if(premOk()){
    const qs=chk(await db.from('quot_storia').select('giornata,quotazione').eq('giocatore_id',id).order('giornata'));
    const pv=giocate.filter(v=>v.fantavoto!==null).map(v=>({x:'G'+v.giornata,y:+v.fantavoto}));
    const pq=[{x:'Inizio',y:g.quot_iniziale??g.quotazione},...qs.map(q=>({x:'G'+q.giornata,y:q.quotazione}))];
    const a=grafico(pv,'#5dff7a','Fantavoto giornata per giornata'),b=grafico(pq,'#ffd447','Quotazione');
    graf=`<div class="card" style="border-color:var(--gold)"><h3>💎 Andamento</h3>${a||'<p class="muted">Il grafico dei voti compare dopo almeno 2 partite giocate.</p>'}${b||'<p class="muted">Il grafico della quotazione compare dopo la prima giornata pubblicata.</p>'}</div>`;
  } else graf='<div class="card" style="border-color:var(--gold)"><p class="muted">💎 Con il Premium vedi i grafici di voti e quotazione giornata per giornata.</p></div>';
  app.innerHTML=`<button onclick="pGiocatori()">← Giocatori</button>
  <div class="card" style="margin-top:12px"><div class="scheda">${g.foto?`<img src="${esc(g.foto)}" alt="">`:''}<div><h2 style="margin:0">${esc(g.nome)}</h2>
    <div style="margin-top:6px">${ruolo(g.ruolo)}${esc(g.squadra)} · <b>${qv(g)}</b>${g.var_q?` <small class="muted">(inizio stagione ${g.quot_iniziale})</small>`:''}</div></div></div>
    <div class="stat"><div><b>${giocate.length}</b>Presenze</div><div><b>${media('voto')}</b>Media voto</div><div><b>${media('fantavoto')}</b>Fantamedia</div>
    <div><b>${somma('gol')}</b>Gol</div><div><b>${somma('assist')}</b>Assist</div><div><b>${vv.filter(v=>v.ammonizione).length}/${vv.filter(v=>v.espulsione).length}</b>Amm/Esp</div></div></div>
  ${graf}<div class="card"><h3>Voti giornata per giornata</h3>${on('f_voto_spiegato')?(premOk()?'<p class="muted" style="font-size:12px">🔍 Tocca una giornata per vedere come è nato il voto.</p>':'<p class="muted" style="font-size:12px">💎 Con il Premium vedi da cosa nasce ogni voto.</p>'):''}
  ${vv.slice().reverse().map(v=>{const sp=on('f_voto_spiegato')&&premOk()?spiega(g.ruolo,v.statistiche,gcDi(v.giornata)):null;const bn=bonusRighe(v);
    const testa=`<div class="row between" style="width:100%"><span><b>G${v.giornata}</b> <small class="muted">${esc(avv(v.giornata))} · ${v.minuti??0}'</small></span><span>Voto <b>${v.voto??'s.v.'}</b> · Fanta <b style="color:var(--gold)">${v.fantavoto??'-'}</b></span></div>`;
    if(!sp) return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">${testa}${v.giudizio?`<div style="font-style:italic;margin-top:3px">"${esc(v.giudizio)}"</div>`:''}</div>`;
    return `<details style="padding:8px 0;border-bottom:1px solid var(--line)"><summary style="color:var(--txt)">${testa}</summary><div style="padding:8px 0 0 10px">
      ${v.corretto?`<p style="color:var(--gold)">✏️ Voto corretto dalla redazione (formula: ${v.voto_auto??'s.v.'})</p>`:''}
      ${sp.map(x=>`<div class="muted">${esc(x)}</div>`).join('')}<div style="margin-top:4px"><b>= Voto ${v.voto??'s.v.'}</b></div>
      ${bn.length?`<div style="margin-top:6px">${bn.map(x=>`<div class="muted">${x}</div>`).join('')}</div><div style="margin-top:4px"><b>= Fantavoto ${v.fantavoto??'-'}</b></div>`:''}</div></details>`}).join('')||'<p class="muted">Nessun voto pubblicato.</p>'}</div>`;
}

// ---------- premium / gettoni ----------
function isPrem(){return profilo&&(profilo.ruolo==='admin'||(profilo.premium_fino&&profilo.premium_fino>=new Date().toISOString().slice(0,10)))}
function montepremi(t){return Math.floor(t.ingresso*t.posti*(100-(+FEAT.rake_calcetto||0))/100)}
function premOk(){return !on('f_premium')||isPrem()}
function dia(p){return on('f_premium')&&p?.premium_fino&&p.premium_fino>=new Date().toISOString().slice(0,10)?' <span title="Premium" style="font-size:.85em">💎</span>':''}
function un(p){return esc(p?.username||'?')+dia(p)}
function grafico(pts,col,tit,minY,maxY){if(pts.length<2)return '';const W=320,H=120,L=26,B=18,ys=pts.map(p=>p.y);const lo=minY??Math.floor(Math.min(...ys)),hi=maxY??Math.ceil(Math.max(...ys));const sp=(hi-lo)||1;
  const X=i=>L+i*(W-L-8)/(pts.length-1),Y=v=>8+(H-B-8)*(1-(v-lo)/sp);
  const linee=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-4}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ffffff22"/><text x="${L-4}" y="${Y(v)+4}" fill="#c9c3ee" font-size="10" text-anchor="end">${+v.toFixed(1)}</text>`).join('');
  const et=pts.map((p,i)=>i%Math.ceil(pts.length/8)===0||i===pts.length-1?`<text x="${X(i)}" y="${H-4}" fill="#c9c3ee" font-size="10" text-anchor="middle">${p.x}</text>`:'').join('');
  return `<div style="margin-top:8px"><small class="muted">${tit}</small><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${linee}${et}<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.map((p,i)=>X(i)+','+Y(p.y)).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="3" fill="${col}"/>`).join('')}</svg></div>`}
function boxPremium(cosa){return `<div class="card" style="border-color:var(--gold)"><h3>💎 ${cosa} è per gli utenti Premium</h3><p class="muted">Il Premium FantaTaccuino sblocca il Calcetto, leghe illimitate, voto spiegato, consiglio formazione, allarme probabili, grafici dei giocatori e il badge 💎. Per attivarlo contatta l'admin.</p></div>`}

// ---------- calcetto ----------

  if(sg.tab==='gestisci'&&profilo.ruolo==='admin'){

      <div class="row">${t.stato==='aperto'?`<button onclick="sg.edit=${t.id};sg.tab='modifica';pSng()">✏️ Modifica</button>`:''}
      <button class="del" onclick="eliminaTavolo(${t.id})">🗑️ Elimina</button></div></div>`).join('')||'<p class="muted">Nessun tavolo.</p>';

    h+=`<button onclick="sg.tab='gestisci';pSng()">← Gestisci tavoli</button><div class="card" style="margin-top:12px"><h3>✏️ Tavolo #${t.id} · Giornata ${t.giornata}</h3>
      <label>Nome</label><input id="mt_nome" value="${esc(t.nome||'')}">
      <label>Partite</label>${pp.map(p=>{const sel=(t.partite||[]).includes(p.api_id),ok=new Date(p.data)>ora;
        return `<div style="padding:5px 0"><label style="color:${ok||sel?'var(--txt)':'var(--muted)'}"><input type="checkbox" class="mp" value="${p.api_id}" data-d="${p.data}" ${sel?'checked':''} ${ok||sel?'':'disabled'}> ${esc(p.casa)} – ${esc(p.trasferta)} <small class="muted">${fmt(p.data)}</small></label></div>`}).join('')}
      <label>Posti</label><select id="mt_posti" ${vuoto?'':'disabled'}>${[2,4,6,8].map(n=>`<option ${n===t.posti?'selected':''}>${n}</option>`).join('')}</select>

    const cl=Object.values(t).sort((a,b)=>b.saldo-a.saldo);
    h+=`<div class="card"><h3>👑 Re del Calcetto · ${new Date().toLocaleString('it-IT',{month:'long'})}</h3><table><tr><th>#</th><th>Utente</th><th>Tavoli</th><th>Vinti</th><th>Saldo</th></tr>

    4. Le carte sono i <b>titolari probabili</b> delle partite del tavolo, uguali per tutti. Si sceglie uno alla volta: chi prende un giocatore lo toglie agli altri.<br>
    4a. È <b>equo</b> grazie al <b>serpentone</b>: chi sceglie per primo in un giro sceglie per ultimo in quello dopo. Chi si prende il più forte in un ruolo paga nel ruolo successivo.<br>
    4b. Hai <b>60 secondi</b> per scegliere, poi il sito sceglie per te. Al calcio d'inizio della prima partita il draft si chiude e le scelte mancanti le fa il sito.<br>
    5. Punti = somma dei fantavoti dei 5 titolari. Il 🃏 Jolly è un titolare. La 🪑 Riserva entra una volta sola, al posto del primo titolare <b>di movimento</b> (D, C, A, jolly compreso) che prende s.v. Il portiere non ha riserva: se prende s.v. vale 0, come vale 0 il posto se anche la riserva è s.v.<br>
    6. Come nel Sit & Go: il banco trattiene il <b>${+FEAT.rake_calcetto||0}%</b> dei palloni dorati in gioco, il resto è il montepremi. Tavoli da 2 e 4: montepremi tutto al vincitore. Tavoli da 6 e 8: 70% al primo e 30% al secondo.<br>
    7. Se il tavolo non si riempie entro il calcio d'inizio viene annullato e i palloni dorati tornano indietro.<br>
    8. <b>🎁 Prova gratuita</b>: chi non ha il Premium riceve <b>100 palloni dorati di prova</b> per provare il Calcetto. Le vincite delle partite di prova non vengono accreditate e non contano per il "Re del mese". Finiti i palloni di prova, per continuare serve il 💎 Premium.<br><br>
    <span class="pd"></span> I palloni dorati servono per giocare ai tavoli del Calcetto e vengono assegnati dall'amministratore.</p></div>`;
  app.innerHTML=h;
}
async function salvaTavolo(id,vuoto){
  const cp=[...document.querySelectorAll('.mp:checked')];
  if(!cp.length) return toast('Scegli almeno una partita',true);
  const o={nome:val('mt_nome')||null,partite:cp.map(x=>+x.value),chiusura:cp.map(x=>x.dataset.d).sort()[0]};
  if(vuoto){o.posti=+val('mt_posti');o.ingresso=+val('mt_ing')||0}

function votoProposto(r){
  const ev=(+r.gol||0)+(+r.assist||0);
  if((+r.minuti||0)<15&&!ev&&!r.espulsione&&!r.rigori_parati) return null;
  let v=6+0.5*Math.min(ev,2);
  if(r.espulsione)v-=1;if(r.rigori_sbagliati)v-=0.5;if(r.autogol)v-=0.5;
  if(r.ruolo==='P'){if(+r.gol_subiti===0&&r.minuti>=60)v+=0.5;if(r.gol_subiti>=3)v-=0.5;if(r.rigori_parati)v+=0.5}
  return Math.max(4,Math.min(9,v));
}

  ${red.righe.length?`<div class="row between"><h3>${esc(p.casa)}</h3><button onclick="proponi()">🔄 Ricalcola voti proposti</button></div>${lato('casa').map(riga).join('')}

function setR(i,k,v){red.righe[i][k]=v;if(['giudizio','ammonizione','espulsione'].includes(k))return;redRender()}
function pm(i,d){const r=red.righe[i];r.voto=Math.max(3,Math.min(10,(r.voto??6)+d));redRender()}
function associa(i,v){
  const r=red.righe[i];if(!v)return;
  if(v.startsWith('nuovo:')){r.nuovoRuolo=v.slice(6);r.ruolo=r.nuovoRuolo;r.id=null;r.nome=r.nome;toast('Verrà creato al salvataggio');return}
  const g=red.tutti.find(x=>x.id==v);Object.assign(r,{id:g.id,nome:g.nome,ruolo:g.ruolo});redRender();
}
function aggRiga(){const id=+val('red_add');const g=red.tutti.find(x=>x.id===id);if(!g)return;
  const r={id:g.id,nome:g.nome,ruolo:g.ruolo,lato:g.lato,minuti:90,gol:0,assist:0,ammonizione:false,espulsione:false,gol_subiti:0,rigori_parati:0,rigori_sbagliati:0,autogol:0,giudizio:''};
  r.voto=votoProposto(r);red.righe.push(r);redRender()}
function proponi(){if(!confirm('Ricalcolare tutti i voti proposti? I ritocchi fatti a mano verranno persi.'))return;red.righe.forEach(r=>r.voto=votoProposto(r));redRender()}
function abbina(nome,lato){
  const w=norm(nome).replace(/[.,]/g,' ').split(/\s+/).filter(x=>x.length>2);
  const c=red.tutti.filter(x=>x.lato===lato&&w.some(p=>norm(x.nome).includes(p)));
  return c.length===1?c[0]:null;
}
function caricaTabellino(d){
  if(d.risultato){if(d.risultato.casa!=null)red.ris.casa=+d.risultato.casa;if(d.risultato.trasferta!=null)red.ris.trasf=+d.risultato.trasferta}
  let n=0;
  for(const x of d.giocatori||[]){
    const lato=x.squadra==='trasferta'?'trasferta':'casa';
    let g=x.id?red.tutti.find(t=>t.id===+x.id&&t.lato===lato):null;
    if(!g) g=abbina(x.nome||'',lato);
    if(g&&red.righe.find(r=>r.id===g.id))continue;
    const r={id:g?.id||null,nome:g?.nome||x.nome||'?',ruolo:g?.ruolo||'C',lato,minuti:+x.minuti||0,gol:+x.gol||0,assist:+x.assist||0,
      ammonizione:!!x.ammonizione,espulsione:!!x.espulsione,gol_subiti:+x.gol_subiti||0,rigori_parati:+x.rigori_parati||0,
      rigori_sbagliati:+x.rigori_sbagliati||0,autogol:+x.autogol||0,giudizio:''};
    red.righe.push(r);n++;
  }
  // gol subiti al portiere se è l'unico della sua squadra
  for(const [l,avv] of [['casa','trasf'],['trasferta','casa']]){
    const pt=red.righe.filter(r=>r.lato===l&&r.ruolo==='P');
    if(pt.length===1&&red.ris[avv]!=null) pt[0].gol_subiti=red.ris[avv];
  }
  red.righe.forEach(r=>{if(r.voto===undefined)r.voto=votoProposto(r)});
  return n;
}
function importaTesto(){
  try{const t=val('red_txt').replace(/^```(json)?/,'').replace(/```$/,'').trim();const n=caricaTabellino(JSON.parse(t));toast(n+' giocatori importati');redRender()}
  catch(e){toast('Testo non valido: '+e.message,true)}
}
async function salvaPartita(){
  const {p}=red;
  for(const r of red.righe){
    if(!r.id&&!r.nuovoRuolo) return toast(`Associa "${r.nome}" a un giocatore o crealo nuovo`,true);
  }
  for(const r of red.righe.filter(r=>!r.id)){
    const g=chk(await db.from('giocatori').insert({nome:r.nome,ruolo:r.nuovoRuolo,squadra:r.lato==='casa'?p.casa:p.trasferta}).select().single());
    r.id=g.id;delete r.nuovoRuolo;
  }
  const righe=red.righe.map(r=>({giocatore_id:r.id,giornata:p.giornata,voto:r.voto,voto_auto:votoProposto(r),minuti:+r.minuti||0,gol:+r.gol||0,assist:+r.assist||0,
    ammonizione:!!r.ammonizione&&!r.espulsione,espulsione:!!r.espulsione,gol_subiti:+r.gol_subiti||0,rigori_parati:+r.rigori_parati||0,
    rigori_sbagliati:+r.rigori_sbagliati||0,autogol:+r.autogol||0,giudizio:r.giudizio||null,corretto:true}));
  const tutti=[...red.casa,...red.trasf].map(x=>x.id),tenuti=new Set(righe.map(r=>r.giocatore_id));
  const via=tutti.filter(id=>!tenuti.has(id));
  if(via.length) chk(await db.from('voti').delete().eq('giornata',p.giornata).in('giocatore_id',via));
  if(righe.length) chk(await db.from('voti').upsert(righe,{onConflict:'giocatore_id,giornata'}));
  chk(await db.from('partite_sa').update({stato_red:'pronta',gol_casa:red.ris.casa,gol_trasferta:red.ris.trasf,stato:'FT'}).eq('api_id',p.api_id));
  toast('Partita salvata ✅');red=null;pAdmin();
}

let prb=null;
async function probApri(id){
  const p=chk(await db.from('partite_sa').select('*').eq('api_id',id).single());
  const gg=chk(await db.from('giocatori').select('id,nome,ruolo,squadra').in('squadra',[p.casa,p.trasferta]).eq('attivo',true));
  const ex=chk(await db.from('probabili').select('giocatore_id').eq('partita_id',id)).map(x=>x.giocatore_id);
  let sel=new Set(ex),proposta=false;
  if(!ex.length){
    const vv=chk(await db.from('voti').select('giocatore_id,minuti,giornata').in('giocatore_id',gg.map(g=>g.id)).lt('giornata',p.giornata).gte('giornata',p.giornata-3));
    const min={};vv.forEach(v=>min[v.giocatore_id]=(min[v.giocatore_id]||0)+(v.minuti||0));
    for(const sq of [p.casa,p.trasferta]){
      const t=gg.filter(g=>g.squadra===sq&&min[g.id]).sort((a,b)=>min[b.id]-min[a.id]);
      const P=t.filter(g=>g.ruolo==='P').slice(0,1),A=t.filter(g=>g.ruolo!=='P').slice(0,10);
      [...P,...A].forEach(g=>sel.add(g.id));
    }
    proposta=sel.size>0;
  }
  prb={p,gg,sel,proposta};probRender();
}
function probRender(){
  const {p,gg,sel,proposta}=prb;
  const blocco=sq=>{const l=gg.filter(g=>g.squadra===sq).sort((a,b)=>ORD[a.ruolo]-ORD[b.ruolo]||a.nome.localeCompare(b.nome));
    const n=l.filter(g=>sel.has(g.id)).length,np=l.filter(g=>sel.has(g.id)&&g.ruolo==='P').length;
    return `<div class="card"><div class="row between"><h3 style="margin:0">${esc(sq)}</h3><span class="badge" style="color:${n===11&&np===1?'var(--green)':'var(--red)'}">${n}/11 · P ${np}/1</span></div>
    ${l.map(g=>`<div style="padding:4px 0"><label style="color:var(--txt)"><input type="checkbox" ${sel.has(g.id)?'checked':''} onchange="probTog(${g.id},this.checked)"> ${ruolo(g.ruolo)}${esc(g.nome)}</label></div>`).join('')}</div>`};
  app.innerHTML=`<button onclick="prb=null;pAdmin()">← Partite della giornata</button><h2 style="margin-top:12px">📋 Probabili: ${esc(p.casa)} – ${esc(p.trasferta)}</h2>
  <p class="muted">${proposta?'💡 Proposta automatica in base ai minuti delle ultime giornate: correggi e salva.':'Spunta gli 11 titolari probabili di ogni squadra (1 portiere).'} Le vedono anche gli utenti nella pagina della partita.</p>
  ${blocco(p.casa)}${blocco(p.trasferta)}
  <button class="pri" style="width:100%;margin-bottom:20px" onclick="probSalva()">💾 Salva probabili formazioni</button>`;
}
function probTog(id,v){v?prb.sel.add(id):prb.sel.delete(id);probRender()}
async function probSalva(){
  const id=prb.p.api_id;
  chk(await db.from('probabili').delete().eq('partita_id',id));
  if(prb.sel.size) chk(await db.from('probabili').insert([...prb.sel].map(g=>({partita_id:id,giocatore_id:g}))));
  toast('Probabili formazioni salvate');prb=null;pAdmin();
}

  app.innerHTML=`<button onclick="pSerieA()">← Serie A</button><h2 style="margin-top:12px">${vv.length?'Pagelle FantaTaccuino':'La partita'}</h2>

    if(!fg.length){app.innerHTML=h+'<p class="muted">Importa prima il calendario.</p>';return}
    if(!fg.find(g=>g.numero==ad.g)) ad.g=fg[0].numero;
    const pp=chk(await db.from('partite_sa').select('casa,trasferta').eq('giornata',ad.g));
    const squadre=[...new Set(pp.flatMap(p=>[p.casa,p.trasferta]))].sort();
    if(!squadre.includes(ad.vsq)) ad.vsq=squadre[0];
    const gg=chk(await db.from('giocatori').select('id,nome,ruolo').eq('squadra',ad.vsq));
    const vv=gg.length?chk(await db.from('voti').select('*').eq('giornata',ad.g).in('giocatore_id',gg.map(g=>g.id))):[];
    const righe=vv.map(v=>({...v,g:gg.find(x=>x.id===v.giocatore_id)})).sort((a,b)=>ORD[a.g.ruolo]-ORD[b.g.ruolo]||b.minuti-a.minuti);
    const pub=fg.find(x=>x.numero==ad.g)?.pubblicata;
    h+=`<div class="row"><select style="flex:1" onchange="ad.g=this.value;pAdmin()">${fg.map(g=>`<option value="${g.numero}" ${g.numero==ad.g?'selected':''}>Giornata ${g.numero} ${g.pubblicata?'✅':''}</option>`).join('')}</select>
      <select style="flex:1" onchange="ad.vsq=this.value;pAdmin()">${squadre.map(s=>`<option ${s===ad.vsq?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
      <p class="muted" style="font-size:12px">${pub?'✅ Voti pubblicati':'📝 Voti in bozza: li vedi solo tu'} · Auto = voto della formula · ✏️ = corretto a mano (non viene più sovrascritto). Voto vuoto = s.v.</p>
      ${righe.length?`<div class="card" style="overflow-x:auto"><table><tr><th>Giocatore</th><th>Min</th><th>Auto</th><th>Voto</th><th>Gol</th><th>Ass</th><th>Amm</th><th>Esp</th><th>GS</th><th>RP</th><th>RS</th><th>AG</th><th></th></tr>
      ${righe.map(v=>{const n=k=>`<input class="n" style="width:44px" type="number" min="0" data-k="${k}" value="${v[k]??0}">`;
        return `<tr data-g="${v.giocatore_id}" oninput="this.classList.add('mod')" onchange="this.classList.add('mod')"><td style="white-space:nowrap">${ruolo(v.g.ruolo)}${esc(v.g.nome)} ${v.corretto?'✏️':''}</td><td>${v.minuti??''}</td><td class="muted">${v.voto_auto??'s.v.'}</td>
        <td><input class="n" style="width:54px" type="number" step="0.5" data-k="voto" value="${v.voto??''}"></td><td>${n('gol')}</td><td>${n('assist')}</td>
        <td><input type="checkbox" data-k="ammonizione" ${v.ammonizione?'checked':''}></td><td><input type="checkbox" data-k="espulsione" ${v.espulsione?'checked':''}></td>
        <td>${n('gol_subiti')}</td><td>${n('rigori_parati')}</td><td>${n('rigori_sbagliati')}</td><td>${n('autogol')}</td>
        <td>${v.corretto?`<button onclick="ripristina(${v.giocatore_id})">↺</button>`:''}</td></tr>`}).join('')}</table></div>
      <button class="pri" style="width:100%" onclick="salvaCorrezioni()">Salva correzioni</button>`:'<p class="muted">Nessun voto per questa squadra: calcola prima i voti dalla scheda Giornate.</p>'}`;
  }

  if(ad.tab==='giocatori'){
    h+=`<div class="card" style="border-color:var(--gold)"><h3>📋 Importa listone da testo</h3>
      <p class="muted">Una riga per giocatore: <b>Nome;Ruolo;Squadra;Quotazione</b> (ruolo P, D, C o A)<br>Es: <i>Federico Dimarco;D;Inter;16</i><br>Se il giocatore esiste già (stesso nome e squadra) aggiorna ruolo e quotazione, altrimenti lo crea.</p>
      <textarea id="lst_txt" rows="7"></textarea>
      <label style="color:var(--txt);display:block;margin:8px 0"><input type="checkbox" id="lst_nuova"> Nuova stagione: prima metti fuori listone tutti i giocatori attuali (restano nello storico)</label>
      <button class="pri" onclick="impListTesto()">Importa listone</button><p id="lst_msg" class="muted"></p></div>
    <div class="card"><h3>Cerca e modifica</h3><input id="adg_q" placeholder="Nome giocatore" oninput="adCercaG()"><div id="adg_r"></div></div>
    <div class="card"><h3>Aggiungi a mano</h3><label>Nome</label><input id="ng_n"><label>Ruolo</label><select id="ng_r"><option>P</option><option>D</option><option>C</option><option>A</option></select>
      <label>Squadra</label><input id="ng_s"><label>Quotazione</label><input id="ng_q" type="number" value="1"><button class="pri" onclick="nuovoG()">Aggiungi</button></div>`;
  }

  if(ad.tab==='articoli'){
    const art=chk(await db.from('articoli').select('*').order('pubblicato_il',{ascending:false}));
    h+=`<div class="card"><h3>Nuovo articolo</h3><label>Titolo</label><input id="ar_t"><label>Link immagine (facoltativo)</label><input id="ar_i">
      <label>Testo</label><textarea id="ar_x" rows="8"></textarea><button class="pri" onclick="nuovoArt()">Pubblica</button></div>
      ${art.map(a=>`<div class="card row between"><span><b>${esc(a.titolo)}</b><br><small class="muted">${fmt(a.pubblicato_il)}</small></span><button class="del" onclick="delRiga('articoli',${a.id})">Elimina</button></div>`).join('')}`;
  }
  app.innerHTML=h;
}
async function salvaRake(){const v=Math.max(0,Math.min(50,+val('rk')||0));chk(await db.from('impostazioni').upsert({chiave:'rake_calcetto',valore:String(v)}));await caricaFeat();toast('Trattenuta: '+v+'%')}
async function salvaWa(){const v=val('wa_num').replace(/[^0-9]/g,'');if(v&&v.length<10)return toast('Numero troppo corto: metti il prefisso 39 davanti',true);chk(await db.from('impostazioni').upsert({chiave:'wa_premium',valore:v}));await caricaFeat();toast(v?'Numero WhatsApp salvato':'Numero tolto');pAdmin()}
async function salvaDon(){const v=val('lk_don');if(v&&!/^https:\/\//.test(v))return toast('Il link deve iniziare con https://',true);chk(await db.from('impostazioni').upsert({chiave:'link_donazioni',valore:v}));await caricaFeat();renderNav();toast('Link salvato')}
async function setPremium(id,anni){const d=new Date();d.setFullYear(d.getFullYear()+anni);chk(await db.from('profili').update({premium_fino:anni?d.toISOString().slice(0,10):null}).eq('id',id));toast(anni?'Premium attivato per 1 anno':'Premium tolto');pAdmin()}
async function modGettoni(id,seg){const n=Math.abs(parseInt(document.getElementById('pg_'+id).value));if(!n)return toast('Scrivi quanti palloni dorati',true);
  const u=chk(await db.from('profili').select('gettoni,username').eq('id',id).single());const nuovo=Math.max(0,u.gettoni+seg*n);
  if(!confirm(`${seg>0?'Aggiungere':'Togliere'} ${n} palloni dorati a ${u.username}? Saldo: ${u.gettoni} → ${nuovo}`))return;
  chk(await db.from('profili').update({gettoni:nuovo}).eq('id',id));toast(`${u.username}: ${nuovo} palloni dorati`);pAdmin()}
async function regalaGettoni(id,n){const u=chk(await db.from('profili').select('gettoni').eq('id',id).single());chk(await db.from('profili').update({gettoni:u.gettoni+n}).eq('id',id));toast('+'+n+' palloni dorati');pAdmin()}
async function toggleFeat(k,v){chk(await db.from('impostazioni').upsert({chiave:k,valore:v?'1':'0'}));await caricaFeat();toast(v?'Funzione attivata':'Funzione spenta');pAdmin()}
async function approva(id){chk(await db.from('profili').update({approvato:true}).eq('id',id));toast('Utente accettato');pAdmin()}
async function cambiaRuolo(id,r){chk(await db.from('profili').update({ruolo:r}).eq('id',id));pAdmin()}
async function rifiuta(id){if(!confirm('Sicuro? L\'utente non potrà più entrare.'))return;chk(await db.from('profili').delete().eq('id',id));pAdmin()}
async function delRiga(t,id){if(!confirm('Eliminare?'))return;chk(await db.from(t).delete().eq('id',id));toast('Eliminato');pAdmin()}
async function salvaScad(n){chk(await db.from('fanta_giornate').update({scadenza:new Date(val('sc_g')).toISOString()}).eq('numero',n));toast('Scadenza salvata')}
async function pubblica(n,stato){
  if(!confirm(stato?'Pubblicare i voti? Diventano visibili, contano per le classifiche e aggiornano le quotazioni (solo la prima volta).':'Ritirare i voti? Torneranno in bozza.'))return;
  chk(await db.from('fanta_giornate').update({pubblicata:stato}).eq('numero',n));toast(stato?'Voti pubblicati':'Voti ritirati');pAdmin();
}
async function salvaCorrezioni(){
  const rows=[...document.querySelectorAll('tr.mod')];
  if(!rows.length) return toast('Nessuna modifica',true);
  for(const tr of rows){
    const get=k=>tr.querySelector(`[data-k="${k}"]`);
    const v=get('voto').value;
    const upd={voto:v===''?null:+v,corretto:true,ammonizione:get('ammonizione').checked,espulsione:get('espulsione').checked};
    ['gol','assist','gol_subiti','rigori_parati','rigori_sbagliati','autogol'].forEach(k=>upd[k]=+get(k).value||0);
    chk(await db.from('voti').update(upd).eq('giornata',ad.g).eq('giocatore_id',+tr.dataset.g));
  }
  toast(rows.length+' voti corretti');pAdmin();
}
async function ripristina(gid){
  const v=chk(await db.from('voti').select('voto_auto').eq('giornata',ad.g).eq('giocatore_id',gid).single());
  chk(await db.from('voti').update({voto:v.voto_auto,corretto:false}).eq('giornata',ad.g).eq('giocatore_id',gid));
  toast('Voto automatico ripristinato (ricalcola la partita per i bonus)');pAdmin();
}
let tAd;
function adCercaG(){clearTimeout(tAd);tAd=setTimeout(async()=>{
  const q=val('adg_q');const b=document.getElementById('adg_r');if(q.length<2){b.innerHTML='';return}
  const gg=chk(await db.from('giocatori').select('*').ilike('nome','%'+q+'%').limit(20));
  b.innerHTML=gg.map(g=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div>${foto(g.foto)}${ruolo(g.ruolo)}<b>${esc(g.nome)}</b> <span class="muted">${esc(g.squadra)}</span></div>
    <div class="row" style="margin-top:6px"><span class="muted">Quotazione</span><input class="n" type="number" min="1" id="q_${g.id}" value="${g.quotazione}">
    <select id="r_${g.id}" style="width:60px;margin:0">${['P','D','C','A'].map(r=>`<option ${r===g.ruolo?'selected':''}>${r}</option>`).join('')}</select>
    <button class="ok" onclick="salvaG(${g.id})">Salva</button><button class="del" onclick="delRiga('giocatori',${g.id})">Elimina</button></div></div>`).join('')||'<p class="muted">Nessuno.</p>';
},300)}
function dataIt(d,o){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(d.trim());const h=/^(\d{1,2})[:.](\d{2})$/.exec((o||'').trim());if(!m||!h)return null;return new Date(+m[3],+m[2]-1,+m[1],+h[1],+h[2]).toISOString()}
async function impCalTesto(){
  const righe=val('cal_txt').split('\n').map(r=>r.trim()).filter(Boolean),ok=[],err=[];
  righe.forEach((r,i)=>{const [g,d,o,c,t]=r.split(';').map(x=>(x||'').trim());const data=dataIt(d,o);
    if(!+g||!data||!c||!t) err.push(i+1); else ok.push({giornata:+g,data,casa:c,trasferta:t})});
  if(err.length) return toast('Righe non valide: '+err.join(', '),true);
  if(!ok.length) return;
  const gs=[...new Set(ok.map(x=>x.giornata))];
  const es=chk(await db.from('partite_sa').select('api_id,giornata,casa,trasferta').in('giornata',gs));
  const mx=chk(await db.from('partite_sa').select('api_id').order('api_id',{ascending:false}).limit(1));
  let id=Math.max(1000000000,(mx[0]?.api_id||0)+1),nuove=[],agg=0;
  for(const p of ok){const e=es.find(x=>x.giornata===p.giornata&&x.casa===p.casa&&x.trasferta===p.trasferta);
    if(e){chk(await db.from('partite_sa').update({data:p.data}).eq('api_id',e.api_id));agg++}
    else nuove.push({api_id:id++,...p,stato:'NS'})}
  if(nuove.length) chk(await db.from('partite_sa').insert(nuove));
  for(const g of gs){const min=ok.filter(x=>x.giornata===g).map(x=>x.data).sort()[0];
    chk(await db.from('fanta_giornate').upsert({numero:g,scadenza:min},{onConflict:'numero'}))}
  toast(`${nuove.length} partite nuove, ${agg} aggiornate`);pAdmin();
}
async function impListTesto(){
  const righe=val('lst_txt').split('\n').map(r=>r.trim()).filter(Boolean),ok=[],err=[];
  righe.forEach((r,i)=>{const [n,ru,sq,q]=r.split(';').map(x=>(x||'').trim());const R=(ru||'').toUpperCase();
    if(!n||!['P','D','C','A'].includes(R)||!sq) err.push(i+1); else ok.push({nome:n,ruolo:R,squadra:sq,quotazione:Math.max(1,+q||1)})});
  if(err.length) return toast('Righe non valide: '+err.join(', '),true);
  if(!ok.length) return;
  const msg=document.getElementById('lst_msg');msg.textContent='Importo…';
  if(document.getElementById('lst_nuova').checked){if(!confirm('Mettere fuori listone tutti i giocatori attuali prima di importare?'))return;chk(await db.from('giocatori').update({attivo:false}).eq('attivo',true))}
  const sq=[...new Set(ok.map(x=>x.squadra))];
  const es=chk(await db.from('giocatori').select('id,nome,squadra').in('squadra',sq));
  const k=g=>norm(g.nome)+'|'+g.squadra;const mp={};es.forEach(g=>mp[k(g)]=g.id);
  const nuovi=[];let agg=0;
  for(const g of ok){const id=mp[k(g)];
    if(id){chk(await db.from('giocatori').update({ruolo:g.ruolo,quotazione:g.quotazione,attivo:true}).eq('id',id));agg++}
    else nuovi.push({...g,attivo:true})}
  for(let i=0;i<nuovi.length;i+=200) chk(await db.from('giocatori').insert(nuovi.slice(i,i+200)));
  const cal=chk(await db.from('partite_sa').select('casa,trasferta'));const squadreCal=new Set(cal.flatMap(p=>[p.casa,p.trasferta]));
  const fuori=sq.filter(x=>!squadreCal.has(x));
  msg.innerHTML=`✅ ${nuovi.length} nuovi, ${agg} aggiornati.`+(fuori.length?`<br><span style="color:var(--red)">⚠️ Squadre che non compaiono nel calendario: ${fuori.map(esc).join(', ')}. Controlla che i nomi siano scritti uguali.</span>`:'');
  toast('Listone importato');
}
async function salvaG(id){chk(await db.from('giocatori').update({quotazione:+document.getElementById('q_'+id).value||1,ruolo:document.getElementById('r_'+id).value}).eq('id',id));toast('Giocatore aggiornato')}
async function nuovoG(){
  const n=val('ng_n'),s=val('ng_s');if(!n||!s)return toast('Nome e squadra obbligatori',true);
  chk(await db.from('giocatori').insert({nome:n,ruolo:val('ng_r'),squadra:s,quotazione:+val('ng_q')||1}));toast('Giocatore aggiunto');pAdmin();
}
async function nuovoArt(){
  const t=val('ar_t'),x=val('ar_x');if(!t||!x)return toast('Titolo e testo obbligatori',true);
  chk(await db.from('articoli').insert({titolo:t,testo:x,immagine_url:val('ar_i')||null}));toast('Articolo pubblicato');pAdmin();
}
</script>
